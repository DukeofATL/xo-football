<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13274F">
<title>xO Football</title>
<script>window.XO_HOSTED = true;</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="xO Football">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Every color below is generated from the team's three colors (see applyColors). */
:root{
  --bg:var(--l-bg,#F4F5F7); --surf:var(--l-surf,#FFFFFF); --surf2:var(--l-surf2,#ECEEF1); --ink:var(--l-ink,#16181C);
  --muted:var(--l-muted,#5F646C); --line:var(--l-line,#D8DCE1); --board:var(--l-board,#FFFFFF);
  --us:var(--l-id,#E07000); --us-ink:var(--l-idink,#1C1D20); --us-line:var(--l-id,#E07000); --us-soft:var(--l-soft,rgba(224,112,0,.14));
  --hi:var(--l-act,#FF8200); --hi-ink:var(--l-actink,#1C1D20); --emph:var(--l-emph,#E07000);
  --chalk:var(--ink); --opp:#5E6B78; --opp-ink:#FFFFFF;
  --good:#17804A; --bad:#C62D24; --warn:#9A6700;
  --x:#CE1141; --o:#13274F;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:var(--d-bg,#1B1C1E); --surf:var(--d-surf,#26272A); --surf2:var(--d-surf2,#2D2E31); --ink:var(--d-ink,#F5F3EE);
    --muted:var(--d-muted,#A9AAAD); --line:var(--d-line,#3E3F42); --board:var(--d-board,#212224);
    --us:var(--d-id,#FF8200); --us-ink:var(--d-idink,#1C1D20); --us-line:var(--d-id,#FF8200); --us-soft:var(--d-soft,rgba(255,130,0,.16));
    --hi:var(--d-act,#FFFFFF); --hi-ink:var(--d-actink,#1C1D20); --emph:var(--d-emph,#FF8200);
    --good:#6FD58A; --bad:#FF7A6B; --warn:#FFC94A; --o:#EAAA00;
  }
}
:root[data-theme="dark"]{
  --bg:var(--d-bg,#1B1C1E); --surf:var(--d-surf,#26272A); --surf2:var(--d-surf2,#2D2E31); --ink:var(--d-ink,#F5F3EE);
  --muted:var(--d-muted,#A9AAAD); --line:var(--d-line,#3E3F42); --board:var(--d-board,#212224);
  --us:var(--d-id,#FF8200); --us-ink:var(--d-idink,#1C1D20); --us-line:var(--d-id,#FF8200); --us-soft:var(--d-soft,rgba(255,130,0,.16));
  --hi:var(--d-act,#FFFFFF); --hi-ink:var(--d-actink,#1C1D20); --emph:var(--d-emph,#FF8200);
  --good:#6FD58A; --bad:#FF7A6B; --warn:#FFC94A; --o:#EAAA00;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.45 var(--body);min-height:100%;
  padding-bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.08;letter-spacing:-.01em}
h2{font-size:30px;margin:16px 0 4px}
h3{font-size:20px;margin:22px 0 8px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{display:none}
.panel.on{display:block}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.btn{border:1.5px solid var(--line);background:var(--surf);border-radius:10px;padding:10px 12px;font-weight:700;min-height:44px}
.btn.pri{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.lab{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.f{width:100%;border:1px solid var(--line);background:var(--surf2);border-radius:8px;padding:9px 10px;min-height:42px}
textarea.f{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lines p{padding:6px 0;border-bottom:1px solid var(--line);margin:0}
.lines p:last-child{border-bottom:0}

/* brand */
.brandband{background:var(--band,#FF8200);color:var(--band-ink,#15171A);margin:0 -14px;padding:16px 14px 18px}
.brandband .brand{margin:0}
.brandband .brand .wm,.brandband .brand .tag,.brandband .brand .wm .fb{color:var(--band-ink,#15171A)}
.brandband .brand .tag{opacity:.85}
.brand{display:flex;align-items:center;gap:12px;margin:14px 0 2px}
.brand svg{width:54px;height:54px;flex:none;border-radius:13px;box-shadow:0 6px 18px rgba(19,39,79,.28)}
.brand .wm{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em}
.brand .wm .fb{color:var(--ink);font-weight:700;margin-left:6px}
.brand .wm .wx,.brand .wm .wo{color:inherit}
.brand .tag{font-size:14px;color:var(--muted);font-weight:600}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav,#2A2B2E);border-top:0;
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:0;border:0;padding:10px 2px 12px;font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--nav-ink,#fff);opacity:.72;min-height:54px}
nav.tabs button.on{opacity:1;color:var(--nav-hi,#fff);box-shadow:inset 0 3px 0 var(--nav-hi,#fff)}

/* live header */
.live-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band,#FF8200);color:var(--band-ink,#15171A);padding:8px 0 10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sbteam{display:flex;align-items:center;gap:10px;background:0;border:0;padding:2px 0;min-height:48px;color:var(--band-ink,#15171A)}
.sbteam.r{justify-content:flex-end}
.sbteam .ab{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.02em;padding:3px 7px;border-radius:6px;line-height:1}
.sbteam .ab.us{background:var(--band-ink,#15171A);color:var(--band,#FF8200)}
.sbteam .ab.opp{background:var(--opp);color:var(--opp-ink)}
.sbteam .pts{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.qsel{border:1.5px solid color-mix(in srgb,var(--band-ink,#000) 35%,transparent);background:color-mix(in srgb,var(--band-ink,#000) 12%,transparent);color:var(--band-ink,#15171A);border-radius:10px;padding:6px 8px;font-family:var(--display);font-weight:700;min-height:42px}
.poss{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.poss button{border:1.5px solid color-mix(in srgb,var(--band-ink,#000) 35%,transparent);background:color-mix(in srgb,var(--band-ink,#000) 10%,transparent);color:var(--band-ink,#15171A);border-radius:10px;min-height:44px;font-weight:700;font-size:15px}
.poss button.us.on{background:var(--surf);border-color:var(--surf);color:var(--ink)}
.poss button.opp.on{background:var(--opp);border-color:var(--opp);color:var(--opp-ink)}
.cap{margin-top:8px;min-height:38px;color:var(--ink);font-size:14.5px;line-height:1.3;padding:7px 10px;border-radius:10px;background:var(--surf);border-left:4px solid var(--line)}
.cap.alert{border-left-color:var(--emph);background:var(--surf2);position:relative}
.loop{position:absolute;left:-8px;top:-7px;width:calc(100% + 16px);height:calc(100% + 14px);pointer-events:none;overflow:visible}
.loop path{fill:none;stroke:var(--emph);stroke-width:2.6;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .75s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.loop path{animation:none;stroke-dashoffset:0}}
.circled{position:relative;display:inline-block;padding:12px 26px}
.cap.alert b:first-child{color:var(--emph)}
.side-lab{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 6px;font-size:14px;font-weight:700;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1.5px solid var(--line);background:var(--board);border-radius:12px;padding:6px 8px 7px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile svg{width:100%;height:auto;display:block;max-height:110px}
.tile .nm{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;letter-spacing:-.02em}
.tile .sub{font-size:12px;color:var(--muted);line-height:1.2;font-weight:600}
.tile .tt{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.tile.on{border-color:var(--us);box-shadow:0 0 0 2px var(--us), 0 0 18px var(--us-soft);background:linear-gradient(var(--us-soft),var(--us-soft)),var(--board)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.acts button{border:1.5px solid var(--line);background:var(--surf);border-radius:10px;min-height:44px;font-weight:700;font-size:15px}
.acts button:active{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.res-lab{display:flex;align-items:center;gap:8px;margin:8px 0 5px;font-size:13px;font-weight:700;color:var(--muted)}
.qm{border:1px solid var(--line);background:var(--surf2);border-radius:999px;width:24px;height:24px;font-size:13px;font-weight:700;line-height:1;padding:0}
.resgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.resgrid .chip{padding:5px 4px;text-align:center;min-height:36px;font-size:13.5px}
.resgrid .wide{grid-column:span 2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chips .k{font-size:13px;color:var(--muted);font-weight:700;margin-right:2px}
.chip{border:1.5px solid var(--line);background:var(--surf2);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:700;min-height:38px}
.chip.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.chip.td.on{background:var(--good);border-color:var(--good);color:#06170C}
.chip.bad.on{background:var(--bad);border-color:var(--bad);color:#fff}
.ctrl{display:grid;grid-template-columns:auto auto 1fr;gap:6px;margin-top:10px}
.strip{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.kp{font-size:12.5px;font-weight:700;border-radius:6px;padding:4px 8px;background:var(--surf2);color:var(--muted)}
.kp.on{color:var(--good)} .kp.off{color:var(--bad)} .kp.close{color:var(--warn)}
.stats{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.stats b{color:var(--ink)}
.log div{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:8px}
.log div:last-child{border-bottom:0}
.log .tag{font-family:var(--display);font-weight:800;font-size:13px;min-width:48px}
.log .o{color:var(--us-line)} .log .d{color:var(--x)}

/* keys */
.key{border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.key.pick{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi)}
.key .t{font-weight:700;line-height:1.25}
.key .s{font-size:13px;color:var(--muted);grid-column:1/2}
.key .pk{grid-row:1/3;grid-column:2;align-self:center}
.step{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.step button{border:1px solid var(--line);background:var(--surf2);border-radius:6px;width:34px;height:30px;font-weight:700}
.st{font-weight:700;font-size:13px;border-radius:6px;padding:3px 8px;white-space:nowrap;align-self:start}
.st.won,.st.on{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st.lost,.st.off{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.st.close{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.nodata{background:var(--surf2);color:var(--muted)}
.st.even{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.kcard.even{border-left-color:var(--warn)}
.pc .st.even{background:rgba(255,201,74,.18);color:#FFC94A}
.kr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kr:last-child{border-bottom:0}
.kr .v{font-size:13px;color:var(--muted);grid-column:1/2}

/* tale of the tape */
.tape{width:100%;border-collapse:collapse;font-size:15px}
.tape td{padding:7px 2px;border-top:1px solid var(--line);text-align:center}
.tape tr:first-child td{border-top:0}
.tape td.lbl{color:var(--muted);font-size:13px;font-weight:700}
.tape td.v{font-family:var(--display);font-weight:700;font-size:18px;width:28%;font-variant-numeric:tabular-nums}
.tape td.v.win{color:var(--emph);font-weight:800}
.tape .hd td{font-family:var(--display);font-weight:800;font-size:15px;padding-bottom:8px}
.tape .hd .us{color:var(--us-line)} .tape .hd .opp{color:var(--muted)}
.src{font-size:12.5px;color:var(--muted);margin-top:8px}
table.raw{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.raw td{padding:3px 0;border-top:1px solid var(--line)}
table.raw td:first-child{color:var(--muted);font-weight:600}
table.raw input{width:70px;text-align:right;border:1px solid var(--line);background:var(--surf2);border-radius:6px;padding:5px;min-height:34px;float:right}
.tsel{appearance:none;-webkit-appearance:none;width:100%;text-align:center;text-align-last:center;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;background:transparent;font-family:var(--display);font-weight:700;font-size:18px;padding:4px 2px;min-height:40px;color:inherit;cursor:pointer}
.tsel:focus-visible{outline:2px solid var(--hi)}
.tape td.v.win .tsel{color:var(--emph);font-weight:800}
.recsel{display:flex;align-items:center;justify-content:center;gap:2px}
.recsel .tsel{width:auto;min-width:36px}
.tsel.mini{display:inline-block;width:auto;font-size:13px;min-height:30px;padding:0 4px;font-family:var(--body)}
/* team colors */
.cpick{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.cpick input{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surf2)}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surf);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.sw input[type=color]{width:30px;height:30px;border:0;padding:0;background:0;border-radius:50%}

/* box score */
table.box{width:100%;border-collapse:collapse;font-size:14px}
table.box th{text-align:right;font-family:var(--display);font-size:15px;font-weight:800;padding:4px}
table.box th:first-child{text-align:left}
table.box td{padding:3px 0;border-top:1px solid var(--line)}
table.box td:first-child{color:var(--muted);font-weight:600;padding-right:6px}
table.box input{width:74px;text-align:right;border:1px solid var(--line);background:var(--surf2);border-radius:6px;padding:6px;min-height:36px;float:right}

.final-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:clamp(24px,7.5vw,38px);white-space:nowrap}
.final-score span:last-child{text-align:right}
.final-score .res{font-size:18px;padding:5px 10px;border-radius:8px;background:var(--hi);color:var(--hi-ink)}

/* ladder */
.rung{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.rung:last-child{border-bottom:0}
.rung .n{font-family:var(--display);font-weight:800;font-size:19px;color:var(--muted);text-align:center}
.rung.done .n{color:var(--good)}
.rung.cur{background:color-mix(in srgb,var(--hi) 12%,transparent);margin:0 -14px;padding:9px 14px}
.rung .nm{font-family:var(--display);font-weight:700;font-size:19px}
.rung .rq{font-size:13.5px;color:var(--muted)}
.rank-now{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;color:var(--us)}
.mix{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--surf2);margin:6px 0}
.mix i{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:4px 4px 4px 0}
.tbl td{padding:6px 4px 6px 0;border-top:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(5,9,20,.6);z-index:40;display:none}
#scrim.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surf);border-radius:16px 16px 0 0;
  max-height:88%;overflow:auto;display:none;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#sheet.on{display:block}
#sheet .in{max-width:640px;margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-h h3{margin:0}
.x{border:1px solid var(--line);background:var(--surf2);border-radius:8px;min-height:40px;padding:6px 12px;font-weight:700}
.gl-big svg{width:100%;height:auto;display:block;background:var(--board);border:1px solid var(--line);border-radius:12px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.answer button{min-height:54px;border:1.5px solid var(--line);background:var(--surf);border-radius:12px;font-family:var(--display);font-weight:800;font-size:22px}
.answer button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.answer button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.lesson-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.lesson-g div{border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--board)}
.lesson-g svg{width:100%;height:52px;display:block}
.lesson-g b{font-family:var(--display);font-weight:800;font-size:20px}
.res-help p{margin:0 0 10px}

/* postgame card */
#card{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#card.on{display:block}
.pc{max-width:460px;margin:12px auto;background:#13274F;color:#F4F1E8;border-radius:18px;padding:18px;position:relative;overflow:hidden;
  background-image:radial-gradient(ellipse 70% 50% at 20% 0%, rgba(244,241,232,.08), transparent 70%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.pc .top{display:flex;align-items:center;gap:10px}
.pc .top svg{width:40px;height:40px}
.pc .hd{font-size:13px;font-weight:700;color:#9CA9C6}
.pc .sc{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(28px,9.5vw,44px);white-space:nowrap;margin:14px 0 6px}
.pc .sc .t{display:flex;align-items:center;gap:8px}

.pillw,.pilll{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:999px}

/* welcome */

}

  };
}
function blank(){
  return { v:9, tab:"scout", game:freshGame(null,true), season:[],
           profile:{name:"", install:{}, walk:{pers:0,pkg:0}} };

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(!raw){ const b = blank(); b.firstRun = true; return b; }
    const s = JSON.parse(raw);
    const b = blank();
    return Object.assign(b, s, {profile:Object.assign(b.profile, s.profile||{})});
  }catch(e){ return blank(); }
}
let S = load();
if(!S.game.tape || (S.game.tape.us && ("rushAtt" in S.game.tape.us || "g" in S.game.tape.us))) S.game.tape = {us:{}, opp:{}, meta:{}};
if(!S.game.tape.meta) S.game.tape.meta = {};
if(!S.game.usColors) S.game.usColors = [S.game.usColor || "#FF8200", "#FFFFFF", "#58595B"];

function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
const G = () => S.game;

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => Math.round(x*100)+"%";
const usN = () => G().us || "Us";
const oppN = () => G().opp || "Opponent";
const usA = () => G().usAb || "US";
const oppA = () => G().oppAb || "OPP";
function countBy(list, f){ const c={}; list.forEach(x=>{ const k=f(x); if(k!=null) c[k]=(c[k]||0)+1; }); return c; }
function mode(list, f){ const c=countBy(list,f); let best=null,n=0; for(const k in c){ if(c[k]>n){best=k;n=c[k];} } return best?{k:best,n}:null; }
function plays(filter){ return G().snaps.filter(s=>!s.st && (!filter || filter(s))); }
function runRate(list){ return list.length ? list.filter(s=>isRun(s.act)).length/list.length : 0; }

/* ---------- brand + team colors ---------- */
let LOGO = {bg:"#13274F", bg2:"#0E1F42", x:"#CE1141", o:"#EAAA00", line:"#FFFFFF"};
function logoColors(cols){
  const [P,S,T] = cols, bg = P, ink = inkOn(P);
  const acc = c => contrast(c,bg) >= 2.8 ? c : ink;
  return {bg, bg2:mixHex(bg,"#000000",0.08), x:acc(S), o:acc(T), line:ink};
}
const logoSVG = k => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="bg-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${LOGO.bg}"/><stop offset="1" stop-color="${LOGO.bg2}"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#bg-${k})"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M116.0 168.0 L162.6 156.5 M189.8 149.8 L236.4 138.3 M263.6 131.6 L310.2 120.1 M337.4 113.4 L384.0 101.9" stroke="${LOGO.line}" stroke-width="24"/><path d="M133 216 L199 282 M199 216 L133 282" stroke="${LOGO.x}" stroke-width="38"/><circle cx="324" cy="226" r="57" stroke="${LOGO.o}" stroke-width="36"/><path d="M154 362 Q296 398 390 342" stroke="${LOGO.line}" stroke-width="32"/><path d="M346.3 336.5 L390 342 L374.1 383.0" stroke="${LOGO.line}" stroke-width="32"/></g></svg>`;
function hexRgb(h){ h=String(h||"#888").replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16)||0; return [n>>16&255,n>>8&255,n&255]; }
function lum(c){ const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}; return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2]); }
const mixc = (a,b,t) => a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const toHex = a => "#"+a.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("").toUpperCase();
const mixHex = (a,b,t) => toHex(mixc(hexRgb(a),hexRgb(b),t));
const L = h => lum(hexRgb(h));
const contrast = (a,b) => { const x=L(a), y=L(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
const inkOn = hex => contrast(hex,"#FFFFFF") >= contrast(hex,"#15171A") ? "#FFFFFF" : "#15171A";
function sat(h){ const [r,g,b]=hexRgb(h).map(v=>v/255), mx=Math.max(r,g,b), mn=Math.min(r,g,b); return mx===mn?0:(mx-mn)/(1-Math.abs(mx+mn-1)); }
function push(hex, bg, target, dark){ let c=hex, i=0; while(contrast(c,bg)<target && i++<16) c = mixHex(c, dark?"#FFFFFF":"#000000", .1); return c; }
/* Build a full light or dark palette from a team's three colors */
function buildTheme(cols, dark){
  const [P,S,T] = cols, byL = cols.slice().sort((a,b)=>L(a)-L(b)), t = {};
  if(dark){
    let bg = L(byL[0]) <= 0.12 ? mixHex(byL[0],"#000000",0.5) : mixHex(P,"#000000",0.82);
    let k=0; while(L(bg)>0.018 && k++<12) bg = mixHex(bg,"#000000",0.18);
    t.bg=bg; t.surf=mixHex(bg,"#FFFFFF",0.07); t.surf2=mixHex(bg,"#FFFFFF",0.11); t.board=mixHex(bg,"#FFFFFF",0.04);
    t.line=mixHex(bg,"#FFFFFF",0.18); t.ink="#F5F3EE"; t.muted=mixHex(bg,"#FFFFFF",0.64);
  } else {
    const bg = "#F4F5F7";
    t.bg=bg; t.surf="#FFFFFF"; t.surf2="#ECEEF1"; t.board="#FFFFFF"; t.line="#D8DCE1";
    t.ink=mixHex("#16181C", byL[0], 0.08); t.muted="#5F646C";
  }
  const bg = t.bg;
  let idSrc = [P,S,T].find(c=>contrast(c,bg)>=1.6) || P;
  if(dark && contrast(idSrc,bg) < 2.2){ const vivid = [S,T].find(c=>contrast(c,bg)>=4 && sat(c)>=0.5); if(vivid) idSrc = vivid; }
  t.id = push(idSrc, bg, dark ? 3.6 : 3, dark); t.idink = inkOn(t.id);
  t.soft = (()=>{ const c=hexRgb(t.id); return `rgba(${c[0]},${c[1]},${c[2]},.16)`; })();
  const order = dark ? [S,T,P] : [P,S,T];
  const act = dark ? (order.find(c=>c!==idSrc && contrast(c,bg)>=2.2) || order.find(c=>contrast(c,bg)>=2.2) || t.id)
                   : (order.find(c=>contrast(c,bg)>=2.2) || t.id);
  t.act = act;
  t.actink = [P,S,T].filter(c=>c!==act).find(c=>contrast(c,act)>=4.5) || inkOn(act);
  const rest = [P,S,T].filter(c=>c!==idSrc && c!==act).sort((a,b)=>sat(b)-sat(a))[0];
  t.emph = rest && sat(rest)>=0.3 && contrast(rest,bg)>=1.6 ? push(rest,bg,3,dark) : t.id;
  return t;
}
function applyColors(){
  const g = G(), r = document.documentElement.style;
  const cols = (g.usColors||["#FF8200","#FFFFFF","#58595B"]).map(c=>toHex(hexRgb(c)));
  const d = buildTheme(cols,true), l = buildTheme(cols,false);
  for(const k in d){ r.setProperty("--d-"+k, d[k]); r.setProperty("--l-"+k, l[k]); }
  const o = g.oppColor || "#5E6B78";
  r.setProperty("--opp",o); r.setProperty("--opp-ink",inkOn(o));
  const [P,S,T] = cols;
  r.setProperty("--band",P); r.setProperty("--band-ink",inkOn(P));
  const darkish = [S,T].filter(c=>L(c)<0.35).sort((a,b)=>L(a)-L(b))[0];
  let nav = darkish || mixHex(P,"#000000",0.55); let n=0; while(L(nav)>0.06 && n++<12) nav = mixHex(nav,"#000000",0.15);
  const hiSrc = [P,S,T].filter(c=>c!==darkish).sort((a,b)=>sat(b)-sat(a))[0] || "#FFFFFF";
  r.setProperty("--nav",nav); r.setProperty("--nav-ink","#FFFFFF"); r.setProperty("--nav-hi", push(hiSrc, nav, 4.5, true));
  LOGO = logoColors(cols);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = d.bg;
}

function offSpots(grp, v){
  v = v || {};
  const gun = v.gun != null ? v.gun : true, alt = !!v.alt;
  const P = [];
  [36,43,57,64].forEach(x=>P.push({x,y:16,t:"o"})); P.push({x:50,y:16,t:"c"});
  const qb = gun ? {x:50,y:34} : {x:50,y:23};
  P.push({x:qb.x,y:qb.y,t:"o"});
  const rb = gun ? {x:58,y:34} : {x:50,y:41};
  if(grp==="11"){
    if(!alt){ P.push({x:71,y:16,t:"o"},{x:6,y:16,t:"o"},{x:20,y:21,t:"o"},{x:94,y:16,t:"o"},{...rb,t:"o"}); }
    else    { P.push({x:29,y:16,t:"o"},{x:6,y:16,t:"o"},{x:82,y:21,t:"o"},{x:94,y:16,t:"o"},{...rb,t:"o"}); }
  } else if(grp==="10"){
    if(!alt){ P.push({x:6,y:16,t:"o"},{x:20,y:21,t:"o"},{x:80,y:21,t:"o"},{x:94,y:16,t:"o"},{...rb,t:"o"}); }
    else    { P.push({x:6,y:16,t:"o"},{x:80,y:22,t:"o"},{x:87,y:19,t:"o"},{x:95,y:16,t:"o"},{...rb,t:"o"}); }
  } else if(grp==="12"){
    if(!alt){ P.push({x:29,y:16,t:"o"},{x:71,y:16,t:"o"},{x:6,y:16,t:"o"},{x:94,y:16,t:"o"},{...rb,t:"o"}); }
    else    { P.push({x:71,y:16,t:"o"},{x:77,y:21,t:"o"},{x:6,y:16,t:"o"},{x:20,y:21,t:"o"},{...rb,t:"o"}); }
  } else if(grp==="21"){
    if(gun){ P.push({x:71,y:16,t:"o"},{x:6,y:16,t:"o"},{x:94,y:16,t:"o"},{x:42,y:34,t:"o"},{x:58,y:34,t:"o"}); }
    else   { P.push({x:71,y:16,t:"o"},{x:6,y:16,t:"o"},{x:94,y:16,t:"o"},{x:alt?55:50,y:32,t:"o"},{x:50,y:43,t:"o"}); }
  }
  const ROLES = {"11":["te","wr","wr","wr","rb"],"10":["wr","wr","wr","wr","rb"],"12":["te","te","wr","wr","rb"],"21":["te","wr","wr","rb","rb"]};
  (ROLES[grp]||[]).forEach((r,i)=>{ if(P[6+i]) P[6+i].k = r; });
  if(v.mirror) P.forEach(p=>p.x=100-p.x);

}
const DBN = {"4 DB":4,"Nickel":5,"Dime":6,"Goal line":2};
function spread(n, lo, hi){ if(n===1) return [(lo+hi)/2]; const r=[]; for(let i=0;i<n;i++) r.push(lo+(hi-lo)*i/(n-1)); return r; }
function defSpots(pkg, v){
  v = v || {};
  const db = pkg==="Goal line" ? (v.db3 ? 3 : 2) : DBN[pkg];
  const dl = pkg==="Goal line" ? (v.db3 ? 5 : 6) : (v.dl3 ? 3 : 4);
  const lb = 11 - dl - db;
  const P = [];
  spread(dl, 50-(dl-1)*4, 50+(dl-1)*4).forEach(x=>P.push({x,y:40,t:"x"}));
  (lb===1?[50]:lb===2?[43,57]:lb===3?[38,50,62]:[33,44,56,67]).forEach(x=>P.push({x,y:30,t:"x"}));
  const gl = pkg==="Goal line";
  const dbs = gl ? [{x:16,y:38},{x:84,y:38},{x:50,y:14}] : [{x:8,y:38},{x:92,y:38},{x:34,y:12},{x:66,y:12},{x:80,y:31},{x:20,y:31}];
  dbs.slice(0,db).forEach(p=>P.push({...p,t:"x",k:"db"}));
  if(v.mirror) P.forEach(p=>p.x=100-p.x);
  return P;
}
/* The players that define the grouping (backs and tight ends on offense, DBs on defense) are drawn bold;
   everyone else is quieter, so 11 and 12 read differently from two feet away. */
function drawSpots(P, color, faint){
  const key = p => p.k==="rb" || p.k==="te" || p.k==="db";
  return `<g>` + P.map(p=>{
    const k = !faint && key(p), op = faint ? .35 : (k ? 1 : .3);
    if(p.t==="c") return `<rect x="${p.x-2.6}" y="${p.y-2.6}" width="5.2" height="5.2" fill="none" stroke="${color}" stroke-width="1.3" opacity="${op}"/>`;
    if(p.t==="o") return k ? `<circle cx="${p.x}" cy="${p.y}" r="3.9" fill="${color}" stroke="${color}" stroke-width="1"/>`
                           : `<circle cx="${p.x}" cy="${p.y}" r="2.7" fill="none" stroke="${color}" stroke-width="1.3" opacity="${op}"/>`;
    const a = k ? 3.4 : 2.5;
    return `<path d="M${p.x-a} ${p.y-a}L${p.x+a} ${p.y+a}M${p.x+a} ${p.y-a}L${p.x-a} ${p.y+a}" stroke="${color}" stroke-width="${k?3:1.5}" stroke-linecap="round" opacity="${op}"/>`;
  }).join("") + `</g>`;
}

}

function tapeTh(id, g){
  g = g || G(); const T = g.tape || {us:{},opp:{}};
  const n = (side,f) => { const v = T[side] && T[side][f]; return v===""||v==null||isNaN(+v) ? null : +v; };
  let v = null, p;
  if(id==="runD" && (p=n("opp","ypc"))!=null) v = Math.floor((p-0.3)*2)/2;
  if(id==="runO" && (p=n("us","ypc"))!=null) v = Math.round(p*2)/2;
  if(id==="thirdD" && (p=n("opp","third"))!=null) v = Math.floor((p-5)/5)*5;
  if(id==="thirdO" && (p=n("us","third"))!=null) v = Math.round(p/5)*5;
  if(id==="rzD" && (p=n("opp","rz"))!=null) v = Math.floor((p-10)/10)*10;
  if(id==="rzO" && (p=n("us","rz"))!=null) v = Math.round(p/10)*10;
  if(v==null) return null;
  const k = KEY[id]; return Math.max(k.min, Math.min(k.max, v));
}

function keyRecord(id, tier){
  let wW=0,wL=0,lW=0,lL=0;
  S.season.forEach(x=>{
    if(!x.keyResults || !x.keyResults[id] || x.keyResults[id]==="even" || (x.result!=="W" && x.result!=="L")) return;
    if(tier && x.tier!==tier) return;
    if(x.keyResults[id]==="won"){ x.result==="W" ? wW++ : wL++; } else { x.result==="W" ? lW++ : lL++; }
  });
  const n = wW+wL+lW+lL;
  return {n, wW, wL, lW, lL, rate: n ? (wW+lL)/n : 0};

  const g = G();

  const prevA = g.alerts[g.alerts.length-1]; if(prevA && prevA.text===text){ g.alertIds.push(id); return; }
  g.alertIds.push(id);
  g.alerts.push({text, n:g.snaps.length, q:g.q});
  g.caption = "";
}

    if(list.length < 12) return;
    const recent = list.slice(-7), base = mode(list.slice(0,-7), s=>s.grp);
    if(!base) return;
    const c = countBy(recent, s=>s.grp);
    for(const k in c){
      if(k!==base.k && c[k]>=4) pushAlert(`dev:${who}:${k}:${Math.floor(list.length/15)}`,
        `${what} out of the base: ${k} on ${c[k]} of the last 7 snaps. Base has been ${base.k}.`);
    }
  };
  dev(off, "off", `${usN()} offense`);
  dev(def, "def", "Your defense");
  const shift = (list, who, team) => {
    if(list.length < 16) return;
    const recent = list.slice(-8), prior = list.slice(0,-8);
    const rr = runRate(recent), rp = runRate(prior), runs = recent.filter(s=>isRun(s.act)).length;
    const b = Math.floor(list.length/10);
    if(rr - rp >= 0.35) pushAlert(`run:${who}:${b}`, `${team} is leaning on the run: ${runs} of the last 8 snaps, up from ${pct(rp)}.`);
    if(rp - rr >= 0.35) pushAlert(`pass:${who}:${b}`, `${team} has gone to the air: ${8-runs} passes in the last 8, up from ${pct(1-rp)}.`);
  };
  shift(off, "off", usN());
  shift(def, "def", oppN());
  const last = g.snaps[g.snaps.length-1];
  if(last && last.pos==="opp"){
    const drive = def.filter(s=>s.series===last.series).length;
    if(drive>=10) pushAlert(`drive:${last.series}`, `Long drive: your defense has been on the field for ${drive} straight snaps.`);
  }
  const gap = def.length - off.length;
  if(gap >= 15) pushAlert(`load:${Math.floor(gap/10)}`, `Workload: your defense has played ${def.length} snaps to your offense's ${off.length}. Watch for a late-game wear-down.`);
}

function tapRes(r){

      BOX.forEach(([f])=>{ const v = src[f]; if(typeof v==="number" && isFinite(v) && v>=0){ b[side][f] = String(Math.round(v)); n++; } }); });
    FULLBOX[ph] = n>0 ? true : FULLBOX[ph];
    READING[ph] = n ? `Read ${n} numbers from the graphic. Check them against the screen.` : "Couldn't find box score numbers in that image. Try a clearer shot of the stat graphic.";
    save();
  }catch(e){
    const c = e && e.code;
    if(c==="not_granted"||c==="sampling_disabled"||c==="images_unavailable"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared"){ CAN_IMG = false; READING[ph] = ""; }
    else READING[ph] = c==="rate_limited" ? "Too many reads right now. Try again in a minute." : c==="image_rejected" ? "That image couldn't be read. Try a screenshot or a JPEG." : "Couldn't read that one. Try again or type the numbers.";
  }

function keyRows(ph){

function shiftLines(fa, fb, la, lb){
  const lines = [];
  const off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp");
  const grpShift = (list, who) => {
    const a = list.filter(fa), b = list.filter(fb);
    if(a.length<4 || b.length<4) return;
    const ca = countBy(a,s=>s.grp), cb = countBy(b,s=>s.grp);
    let best = null;
    new Set([...Object.keys(ca),...Object.keys(cb)]).forEach(k=>{
      const d = (cb[k]||0)/b.length - (ca[k]||0)/a.length;
      if(Math.abs(d)>=0.2 && (!best || Math.abs(d)>Math.abs(best.d))) best = {k,d,pa:(ca[k]||0)/a.length,pb:(cb[k]||0)/b.length};
    });
    if(best) lines.push(`${who}: ${best.k} went from ${pct(best.pa)} of snaps in the ${la} to ${pct(best.pb)} in the ${lb}.`);
  };
  const runShift = (list, who) => {
    const a = list.filter(fa), b = list.filter(fb);
    if(a.length<5 || b.length<5) return;
    const ra = runRate(a), rb = runRate(b);
    if(Math.abs(rb-ra)>=0.25) lines.push(`${who} ran on ${pct(ra)} of snaps in the ${la} and ${pct(rb)} in the ${lb}.`);
  };
  grpShift(off, `${usN()} personnel`); grpShift(def, "Your defensive package");
  runShift(off, usN()); runShift(def, oppN());
  if(!lines.length) lines.push(`No big changes between the ${la} and the ${lb} in what you charted.`);
  return lines;
}
function boxVsFilm(ph){
  const c = ctx(ph), g = G(), L = [];
  const u = f=>bv(c.box,"us",f), o = f=>bv(c.box,"opp",f);
  if(u("yds")!=null && o("yds")!=null) L.push(`Box score: ${usA()} ${u("yds")} yards, ${oppA()} ${o("yds")}.`);
  else L.push("Add total yards (tap Enter the full box score) to compare the stat sheet with your charting.");
  if(c.off.length){ const m = mode(c.off,s=>s.grp); L.push(`Your charting: ${usA()} lived in ${m.k} personnel (${m.n} of ${c.off.length} snaps) and ran on ${pct(runRate(c.off))}.`); }
  if(c.def.length){ const m = mode(c.def,s=>s.grp); L.push(`${oppA()} ran on ${pct(runRate(c.def))} of snaps. Your defense spent the most snaps in ${m.k} (${m.n} of ${c.def.length}).`); }
  const tell = [];
  if(u("yds")!=null && o("yds")!=null && u("yds")>=o("yds")+50 && g.score.us<=g.score.opp)
    tell.push(`${usN()} is winning the yardage and not the scoreboard. Look at turnovers and the red zone.`);
  const ra = u("rushAtt"), ry = u("rushYds");
  if(ra && ry!=null && ry/ra>=5 && c.off.length>=8 && runRate(c.off)<0.45)
    tell.push(`Running for ${(ry/ra).toFixed(1)} a carry but running on only ${pct(runRate(c.off))} of snaps. The film says lean on it.`);
  if(u("yds")!=null && u("yds")>=150 && c.snaps.some(s=>s.res) && exps(c.off)===0)
    tell.push("The yards came in a grind: no explosive plays charted.");
  const light = c.def.filter(s=>s.grp==="Nickel"||s.grp==="Dime");
  if(light.length>=5 && runRate(light)>=0.6)
    tell.push(`${oppN()} is running at your lighter packages: ${light.filter(s=>isRun(s.act)).length} runs on ${light.length} snaps against Nickel or Dime.`);
  if(c.def.length >= c.off.length+10)
    tell.push(`Your defense has played ${c.def.length} snaps to your offense's ${c.off.length}. Watch for the wear-down.`);
  return {L, tell: tell.length ? tell : ["Box score and charting agree so far. No hidden story yet."]};
}

function outcome(){ const g=G(); return g.score.us>g.score.opp ? "W" : g.score.us<g.score.opp ? "L" : "T"; }
function story(){
  const g = G(), res = outcome(), off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp");
  const bits = [];
  bits.push(res==="W" ? (g.role==="Underdog" ? "Upset win." : "Win.") : res==="L" ? (g.role==="Favorite" ? "Upset loss." : "Loss.") : "Tie.");
  if(off.length){ const m = mode(off,s=>s.grp); bits.push(`${m.k} personnel carried the offense`); }
  if(def.length){ const rr = runRate(def); bits.push(rr>=0.55 ? `${oppN()} ran at you` : rr<=0.4 ? `${oppN()} threw it` : `${oppN()} stayed balanced`); }
  const d = decidingKey(); if(d) bits.push(`decided by ${KEY[d.id].short.toLowerCase()}`);
  return bits[0] + " " + bits.slice(1).join(", ").replace(/^./,c=>c.toUpperCase()) + (bits.length>1?".":"");
}
function howLines(){
  const g = G(), L = [], off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp");
  if(off.length){ const c = countBy(off,s=>s.grp);
    L.push(`${usA()} offense: ` + Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>{ const l=off.filter(s=>s.grp===k); return `${k} on ${l.length} snap${l.length>1?"s":""} (run ${pct(runRate(l))})`; }).join(", ") + "."); }
  if(def.length){ const c = countBy(def,s=>s.grp);
    L.push(`${oppA()} vs your packages: ` + Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>{ const l=def.filter(s=>s.grp===k); return `${k} ${l.length} snap${l.length>1?"s":""} (they ran ${pct(runRate(l))})`; }).join(", ") + "."); }
  const tds = plays(s=>s.res==="TD"||s.res==="Turnover TD");
  if(tds.length) L.push("Touchdowns charted: " + tds.map(s=>s.res==="Turnover TD" ? `${s.pos==="us"?oppA():usA()} return TD off ${s.pos==="us"?usA()+" "+s.grp+" personnel":"your "+s.grp} (${s.q===5?"OT":"Q"+s.q})` : `${s.pos==="us"?usA():oppA()} ${s.pos==="us"?s.grp:"vs "+s.grp}, ${ACT[s.act][2]} (${s.q===5?"OT":"Q"+s.q})`).join("; ") + ".");
  const tos = plays(s=>s.res==="Turnover"||s.res==="Turnover TD");
  if(tos.length) L.push("Turnovers charted: " + tos.map(s=>`${s.pos==="us"?usA():oppA()} on ${s.pos==="us"?s.grp+" personnel":"a snap vs your "+s.grp} (${s.q===5?"OT":"Q"+s.q})`).join("; ") + ".");
  const drives = countBy(def, s=>s.series); const longest = Math.max(0,...Object.values(drives));
  if(longest>=3) L.push(`Longest stand for your defense: ${longest} straight snaps.`);
  if(!L.length) L.push("Chart some snaps and the story shows up here.");
  return L;
}

function ladderSVG(r){
  const N = RANKS.length, H = 76*N + 36, pts = RANKS.map((_,i)=>({x: i%2 ? 96 : 40, y: H-34-i*76}));
  const seg = (a,b) => `C ${a.x} ${a.y-34}, ${b.x} ${b.y+34}, ${b.x} ${b.y}`;
  let done = "", rest = "";
  for(let i=1;i<N;i++){ const s = ` M${pts[i-1].x} ${pts[i-1].y} ${seg(pts[i-1],pts[i])}`; if(i<=r-1) done += s; else rest += s; }
  const top = pts[N-1];
  const nodes = pts.map((p,i)=>{
    const st = i < r ? "done" : i===r ? "cur" : "lock";
    const node = st==="done" ? `<circle cx="${p.x}" cy="${p.y}" r="15" fill="var(--us)"/><path d="M${p.x-6} ${p.y} l4 5 l9-10" stroke="var(--us-ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`

const normName = s => String(s||"").toLowerCase().replace(/&/g,"and").replace(/\bst\.?\b/g,"state").replace(/[^a-z0-9]/g,"");
const ALIAS = {pitt:"pittsburgh", umass:"massachusetts", uconn:"connecticut", ole_miss:"olemiss", miamifl:"miami", miamiflorida:"miami", usc:"usc", byu:"byu", lsu:"lsu", tcu:"tcu", smu:"smu", ucf:"ucf", utsa:"utsa", utep:"utep", unlv:"unlv"};
function seasonTeam(name){
  if(!SEASON || !SEASON.teams || !name) return null;
  const n = normName(name), target = ALIAS[n] || n;
  for(const k in SEASON.teams) if(normName(k)===target) return SEASON.teams[k];
  return null;
}
async function loadSeason(){
  if(!HOSTED) return;

/* Fill the Tale of the Tape from season stats. force=false only fills a side that's still empty. */
function autoTape(force){ force = true;
  if(!SEASON) return false;
  const g = G(); let changed = false;
  [["us",g.us],["opp",g.opp]].forEach(([side,name])=>{
    const t = seasonTeam(name);
    if(!t || !t.tape){ if(g.tape[side] && Object.keys(g.tape[side]).length){ g.tape[side] = {}; changed = true; } return; }
    const T = g.tape[side] = g.tape[side] || {};
    const empty = !Object.keys(T).some(k=>T[k]!==""&&T[k]!=null);
    if(!force && !empty) return;
    const put = (f, v, lo, hi, dp) => { if(typeof v!=="number" || !isFinite(v)) return; v = Math.max(lo, Math.min(hi, v)); T[f] = dp ? v.toFixed(dp) : String(Math.round(v)); };
    const d = t.tape;
    put("w",d.w,0,15,0); put("l",d.l,0,15,0); put("ppg",d.ppg,0,70,0); put("papg",d.papg,0,60,0);
    put("run",d.run,25,75,0); put("ypp",d.ypp,3,9,1); put("ypc",d.ypc,1.5,8,1); put("ypa",d.ypa,3,12,1);
    put("third",d.third,15,65,0); put("tom",d.tom,-15,15,0);
    if(typeof d.games==="number") g.tape.meta.thru = String(Math.max(+(g.tape.meta.thru||0), Math.max(1, Math.min(16, d.games))));
    changed = true;
  });
  return changed;
}

const TEND = [

function tendHTML(){

  const rows = TEND.map(r=>{

    if(r.better && typeof x==="number" && typeof y==="number" && x!==y){ const aw = r.better>0 ? x>y : x<y; wa = aw?"win":""; wb = aw?"":"win"; }
    return `<tr><td class="v ${wa}">${fmt(a,r)}</td><td class="lbl">${r.l}</td><td class="v ${wb}">${fmt(b,r)}</td></tr>`;

/* ---------- ESPN: pull the live box score at halftime or the final ---------- */
async function espnGet(path){
  for(const base of ["https://site.api.espn.com","https://site.web.api.espn.com"]){
    try{ const r = await fetch(base+path); if(r.ok) return await r.json(); }catch(e){}
  }
  throw new Error("unreachable");
}
function espnMatch(team, name){
  const n = normName(name); if(!n || !team) return 0;
  const vals = [team.location, team.shortDisplayName, team.name, team.abbreviation, team.displayName].map(normName);
  if(vals.includes(n)) return 2;
  return normName(team.displayName).startsWith(n) ? 1 : 0;
}
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
async function findEspnGame(){
  const g = G(), now = new Date(), days = [now, new Date(now.getTime()-864e5)];
  let best = null;
  for(const d of days){
    const sb = await espnGet(`/apis/site/v2/sports/football/college-football/scoreboard?dates=${ymd(d)}&groups=80&limit=300`);
    for(const ev of (sb.events||[])){
      const comps = (ev.competitions && ev.competitions[0] && ev.competitions[0].competitors) || [];
      const su = Math.max(0, ...comps.map(c=>espnMatch(c.team, g.us))), so = Math.max(0, ...comps.map(c=>espnMatch(c.team, g.opp)));
      const score = su*3 + so;
      if(su && (!best || score > best.score)) best = {id:ev.id, score};
    }
    if(best && best.score >= 7) break;
  }
  return best && best.id;
}
async function pullBox(ph){
  const g = G(); BOX_MSG[ph] = "Pulling the box score from ESPN…"; ESPN_SCORE[ph] = null; rerenderBox(ph);
  try{
    const id = await findEspnGame();
    if(!id){ BOX_MSG[ph] = `Couldn't find a ${g.us} game on ESPN today. Check the team name, or enter the numbers.`; rerenderBox(ph); return; }
    const sum = await espnGet(`/apis/site/v2/sports/football/college-football/summary?event=${id}`);
    const teams = (sum.boxscore && sum.boxscore.teams) || [];
    const box = ph==="half" ? g.half : g.fin; let n = 0;
    const sideOf = t => espnMatch(t, g.us) >= espnMatch(t, g.opp) && espnMatch(t, g.us) ? "us" : "opp";
    teams.forEach(bt=>{
      const side = sideOf(bt.team), stats = bt.statistics || [];
      const val = (...names) => { for(const nm of names){ const s = stats.find(x=>x.name===nm); if(s) return String(s.displayValue); } return null; };
      const num = v => { const x = parseFloat(String(v).replace(/,/g,"")); return isFinite(x) ? String(Math.round(x)) : null; };
      const set = (f, v) => { if(v!=null){ box[side][f] = v; n++; } };
      set("yds", num(val("totalYards")));
      set("passYds", num(val("netPassingYards")));
      set("rushAtt", num(val("rushingAttempts")));
      set("rushYds", num(val("rushingYards")));
      set("to", num(val("turnovers")));
      const third = val("thirdDownEff");
      if(third && /^\d+-\d+$/.test(third)){ const [m,a] = third.split("-"); set("thirdConv", m); set("thirdAtt", a); }
      const rz = val("redZoneAttempts","redZoneEff");
      if(rz && /^\d+-\d+$/.test(rz)){ const [m,a] = rz.split("-"); set("rzTd", m); set("rzTrips", a); }
    });
    const comp = sum.header && sum.header.competitions && sum.header.competitions[0];
    const status = comp && comp.status && comp.status.type ? (comp.status.type.shortDetail || comp.status.type.detail || "") : "";
    if(comp && comp.competitors){
      const sc = {us:null, opp:null};
      comp.competitors.forEach(c=>{ const s = sideOf(c.team); const v = parseInt(c.score,10); if(isFinite(v)) sc[s] = v; });
      if(sc.us!=null && sc.opp!=null && (sc.us!==g.score.us || sc.opp!==g.score.opp)) ESPN_SCORE[ph] = sc;
    }
    save();
    BOX_MSG[ph] = n ? `Pulled ${n} numbers from ESPN${status?` (${status})`:""}. Check them against the broadcast.` : "ESPN found the game but hasn't posted team stats yet. Try again in a minute.";
  }catch(e){
    BOX_MSG[ph] = "Couldn't reach ESPN from this phone right now. Enter the numbers, or try again.";
  }
  rerenderBox(ph);
}
function useEspnScore(ph){ const sc = ESPN_SCORE[ph]; if(!sc) return; G().score.us = sc.us; G().score.opp = sc.opp; ESPN_SCORE[ph] = null; save(); ph==="half" ? renderHalf() : renderFinal(); }
function rerenderBox(ph){ if(S.tab==="half" && ph==="half") renderHalf(); if(S.tab==="final" && ph==="final") renderFinal(); }
function espnBlock(ph){
  if(!HOSTED) return "";
  const sc = ESPN_SCORE[ph];
  return `<button class="btn block" style="margin-bottom:8px" onclick="pullBox('${ph}')">Pull the box score from ESPN</button>
    ${BOX_MSG[ph] ? `<p class="hint" style="margin:0 0 8px">${esc(BOX_MSG[ph])}</p>` : ""}
    ${sc ? `<p class="hint" style="margin:0 0 8px">ESPN has ${esc(usA())} ${sc.us}, ${esc(oppA())} ${sc.opp}. <button class="link" onclick="useEspnScore('${ph}')">Use ESPN's score</button></p>` : ""}`;
}

}
const AUTO_RES = ["TD","Turnover","Turnover TD"];
function editSnap(i){
  const g = G(), s = g.snaps[i]; if(!s) return;
  const latest = i===g.snaps.length-1, team = s.pos==="us" ? usN() : oppN();
  if(s.st){

    return;
  }
  const list = s.pos==="us" ? OFF : DEF, auto = AUTO_RES.includes(s.res);
  const resOpts = ["","4+","Stuffed","Explosive"].concat(latest ? AUTO_RES : []);
  openSheet(`<div class="sheet-h"><h3>Fix this snap</h3><button class="x" onclick="closeSheet()">Done</button></div>
    <p class="hint">${esc(team)}, ${s.q===5?"OT":"Q"+s.q}. Changes save as you tap.</p>

    <span class="lab">Result</span>
    ${auto && !latest ? `<p class="hint">This snap changed the score or possession, so its result can change only while it's the latest snap.</p>`
      : `<div class="grid3">${resOpts.map(r=>`<button class="chip ${(s.res||"")===r?"on":""}" onclick="fixSnap(${i},'res','${r}')">${r?RES_LABEL[r]:"None"}</button>`).join("")}</div>`}
    ${!auto || latest ? `<button class="btn block" style="margin-top:14px" onclick="deleteSnap(${i})">Delete this snap</button>` : ""}`);
}
function fixSnap(i, f, v){
  const g = G(), s = g.snaps[i]; if(!s) return;
  const latest = i===g.snaps.length-1;
  if(f==="res"){
    if(!latest && (AUTO_RES.includes(v) || AUTO_RES.includes(s.res))) return;
    reverseAuto(s); s.res = v || null;
    if(latest && s.res) applyResAuto(s); else s.auto = null;
  } else s[f] = v;
  save(); renderLive(); editSnap(i);
}
function deleteSnap(i){
  const g = G(), s = g.snaps[i]; if(!s) return;
  if(i===g.snaps.length-1){ undo(); closeSheet(); return; }
  if(AUTO_RES.includes(s.res)) return;
  g.snaps.splice(i,1); save(); closeSheet(); renderLive();
}

/* ---------- Halftime: A keys, B box vs film, C third-quarter tells ---------- */
const HALF_LABEL = {on:"✓ Winning it", off:"✗ Losing it", close:"~ Too close", nodata:"Not punched in"};
function keyCards(ph){
  const g = G();
  if(!g.picked.length){
    if(ph==="half") return `<div class="card nokeys"><b>Pick your keys now</b><p>Without keys, halftime can describe the game but can't grade it.</p>
      <button class="btn pri block" onclick="applySuggested();renderHalf()">Use suggested keys</button>
      <button class="btn block" style="margin-top:8px" onclick="go('scout')">Choose my own</button></div>`;
    return `<div class="card">${emptyState(glyphOff("11"), "No keys picked", "Pick three in the Scouting Report and they're graded here.")}</div>`;
  }
  const L = ph==="half" ? HALF_LABEL : ST_LABEL;
  return `<div class="kcards">${g.picked.map(id=>{ const k=KEY[id], r=keyState(k,ph);
    return `<div class="kcard ${r.st}"><span class="st ${r.st}">${L[r.st]}</span><div class="kc-t">${esc(k.title(thOf(k)))}</div><div class="kc-v">${esc(r.text)}</div></div>`; }).join("")}</div>`;
}
function collision(){
  const c = ctx("half"), g = G(), u = f=>bv(c.box,"us",f), o = f=>bv(c.box,"opp",f);
  const rr = runRate(c.off), top = c.off.length ? mode(c.off,s=>s.grp).k : null;
  const ra = u("rushAtt"), ry = u("rushYds"), oa = o("rushAtt"), oy = o("rushYds"), uy = u("yds"), oyd = o("yds");
  if(ra && ry!=null && c.off.length>=6){
    const ypc = ry/ra;
    if(ypc>=5 && rr<0.45) return `Box says ${usN()} runs for ${ypc.toFixed(1)} a carry, but you charted runs on only ${pct(rr)} of snaps. The run game works and they're not leaning on it.`;
    if(ypc>=4.5 && rr>=0.55) return `Box says ${ry} rushing yards at ${ypc.toFixed(1)} a carry, and you charted runs on ${pct(rr)}, mostly from ${top}. The yards are the plan, not a surprise.`;
    if(ypc<3.5 && rr>=0.55) return `You charted runs on ${pct(rr)}, but the box says ${ypc.toFixed(1)} a carry. ${usN()} keeps running into a wall.`;
  }
  if(oa && oy!=null && c.def.length>=6){
    const ypc = oy/oa, light = c.def.filter(s=>s.grp==="Nickel"||s.grp==="Dime").length/c.def.length;
    if(ypc>=5 && light>=0.6) return `Box says ${oppN()} runs for ${ypc.toFixed(1)} a carry, and your defense spent ${pct(light)} of snaps in Nickel or Dime. They're running at the light box.`;
    if(ypc>=5) return `Box says ${oppN()} runs for ${ypc.toFixed(1)} a carry against you. Run defense is the story of the half.`;
  }
  if(uy!=null && oyd!=null && uy>=oyd+50 && g.score.us<=g.score.opp) return `Box says ${usN()} outgained them by ${uy-oyd} yards and still isn't ahead. Look at turnovers and the red zone.`;
  if(uy==null && ra==null) return "Punch in the halftime box score and this compares the stat sheet with your film.";
  if(c.off.length<6 && c.def.length<6) return "Not enough charted snaps yet to hold your film up against the box score.";
  return "The box score and your charting tell the same story so far.";
}
function q3Tells(){
  const c = ctx("half"), g = G(), out = [];
  if(c.off.length<8 || c.def.length<8){
    if(!c.def.length) out.push(`You've charted 0 defensive snaps. The third-quarter read needs both sides, so chart ${oppN()} after the break.`);
    else if(!c.off.length) out.push(`You've charted 0 offensive snaps. Chart ${usN()} after the break.`);
    else out.push(`Not enough film for a third-quarter read yet: ${c.off.length} offensive and ${c.def.length} defensive snaps. It needs 8 of each.`);
    return out;
  }
  const bad = g.picked.map(id=>({k:KEY[id], r:keyState(KEY[id],"half")})).find(x=>x.r.st==="off");
  if(bad) out.push(`The key to flip: ${bad.k.title(thOf(bad.k))}. Right now: ${bad.r.text}.`);
  const cnt = countBy(c.off,s=>s.grp), m = mode(c.off,s=>s.grp), share = m.n/c.off.length;
  if(share>=0.6){ const alt = OFF.find(x=>x!==m.k && !cnt[x]) || OFF.find(x=>x!==m.k); out.push(`${usN()} lived in ${m.k} (${pct(share)}). If ${alt} shows up after halftime, that's the adjustment.`); }
  const orr = runRate(c.def);
  if(orr>=0.6) out.push(`${oppN()} ran on ${pct(orr)} of snaps. A pass-heavy opening drive means they changed the plan.`);
  else if(orr<=0.4) out.push(`${oppN()} threw on ${pct(1-orr)} of snaps. If they start running, they're protecting a lead or found something.`);
  const dm = mode(c.def,s=>s.grp);
  if(out.length<2 && dm) out.push(`Your defense lived in ${dm.k} (${pct(dm.n/c.def.length)}). Watch for a package change on their first series.`);
  return out.slice(0,2);
}

function renderHalfReport(){

/* ---------- Final ---------- */
function coverage(){
  const g = G(), hit = new Set(), us = new Set(), opp = new Set();
  plays().forEach(s=>{ hit.add(s.series); (s.pos==="us"?us:opp).add(s.series); });
  const total = Math.max(g.series, hit.size);
  return {n:hit.size, total, pct: total ? hit.size/total : 0, us:us.size, opp:opp.size};
}
function coverageLine(){
  const c = coverage(); if(!c.n) return "";
  if(!c.us || !c.opp){ const side = c.us ? usN() : oppN(), other = c.us ? oppN() : usN();
    return `One-sided film: only ${side} charted (${c.n} possession${c.n===1?"":"s"}). Chart ${other} too, and Halftime and the Final can compare both sides.`; }
  return `You charted ${c.n} of ${c.total} possessions: ${usA()} ${c.us}, ${oppA()} ${c.opp}.`;
}
function decidingKey(){
  const res = outcome(); if(res==="T") return null;
  const c = ctx("final");
  const cand = ids => ids.map(id=>{ const raw = KEY[id].ev(c, thOf(KEY[id])); return raw && !raw.close && raw.pass===(res==="W") ? {id, gap:raw.gap||0, raw} : null; })
                         .filter(Boolean).sort((a,b)=>b.gap-a.gap);
  const mine = cand(G().picked); if(mine.length) return {id:mine[0].id, mine:true, raw:mine[0].raw};
  const all = cand(KEYS.map(k=>k.id)); return all.length ? {id:all[0].id, mine:false, raw:all[0].raw} : null;
}
function story3(){
  const off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp"), out = [];
  if(off.length){ const m = mode(off,s=>s.grp); out.push(`${usN()} lived in ${m.k} (${pct(m.n/off.length)}) and ran on ${pct(runRate(off))}.`); }
  else if(def.length) out.push(`${oppN()} ran on ${pct(runRate(def))} of snaps.`);
  const sh = shiftLines(s=>s.q<=2, s=>s.q>=3, "first half", "second half").filter(t=>!/^No big changes/.test(t));
  out.push(sh.length ? sh[0] : "No real change after halftime in what you charted.");
  const d = decidingKey(); if(d) out.push(`${KEY[d.id].short} decided it: ${d.raw.text}.`);
  return out.slice(0,3);
}
function renderFinalReport(){
  const g = G(), el = document.getElementById("finalReport"); if(!el) return;
  const res = outcome(), d = decidingKey(), started = g.score.us || g.score.opp || g.snaps.length, cov = coverage();
  const tag = (ab, col) => `<span class="ab" style="background:${esc(col)};color:${inkOn(col)}">${esc(ab)}</span>`;
  el.innerHTML = `
    <div class="card scorehero">
      <div class="t">${tag(usA(), g.usColors[0])}<b>${g.score.us}</b></div>
      <div class="res ${started?res:""}">${!started ? "Final" : res==="W" ? "Win" : res==="L" ? "Loss" : "Tie"}</div>
      <div class="t r"><b>${g.score.opp}</b>${tag(oppA(), g.oppColor)}</div>
    </div>
    ${plays().length ? `<p class="hint cov ${cov.us&&cov.opp?"":"warn"}">${esc(coverageLine())}</p>` : ""}
    <div class="card dk"><div class="eyebrow">Deciding Key</div>
      ${d ? `<div class="circled">${markerLoop()}<b>${esc(KEY[d.id].title(thOf(KEY[d.id])))}</b></div>
             <p class="math">Happened: ${esc(d.raw.text)}.</p><p class="hint">${d.mine?"It was one of your three.":"It wasn't in your three."} It missed or beat its line by the widest margin, in the direction of the final score.</p>`
           : `<p class="hint">Once the final score and your keys' numbers are in, the key that decided the game shows up here with the math.</p>`}</div>
    <h3>Your keys</h3>${keyCards("final")}`;
  const items = [];
  howLines().forEach(t=>items.push(["How it happened", t]));
  shiftLines(s=>s.q<=2, s=>s.q>=3, "first half", "second half").filter(t=>!/^No big changes/.test(t)).forEach(t=>items.push(["Second half", t]));
  const st = plays().length ? story3() : [];
  document.getElementById("finalStory").innerHTML = `<h3>The story</h3>
    ${st.length ? `<div class="card storyp">${st.map(x=>`<p>${esc(x)}</p>`).join("")}</div>` : `<div class="card">${emptyState(glyphOff("21"), "No story yet", "Chart the game and the story writes itself here.")}</div>`}
    ${items.length ? `<details class="card boxd"><summary><b>Full breakdown</b><span class="bstat">${items.length} notes</span></summary><div style="margin-top:6px">${items.map(([t,x])=>`<div class="fi"><span class="ftag">${t}</span><p>${esc(x)}</p></div>`).join("")}</div></details>` : ""}`;
  document.getElementById("finalActions").innerHTML = `
    <div class="row" style="margin:14px 0 8px"><button class="btn grow" onclick="showCard()">Postgame card</button>
      <button class="btn pri grow" onclick="lockGame()">${g.locked?"Update Film Room":g.halfLocked?"Save the full game":"Lock into Film Room"}</button></div>
    ${g.locked ? `<p class="hint">Locked into the Film Room. Back up your book from the Film Room to keep it safe.</p><button class="btn block" style="margin-top:8px" onclick="newGame()">Start the next game</button>` : ""}
    ${helpFooter()}`;
}
function aggOf(list){ const a = {}; list.forEach(s=>{ const o = a[s.grp] = a[s.grp]||{n:0,run:0,exp:0}; o.n++; if(isRun(s.act)) o.run++; if(s.res==="Explosive") o.exp++; }); return a; }
function lockGame(partial){
  const g = G(), off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp");
  if(!g.opp){ alert("Pick the opponent in the Scouting Report first."); return; }
  const keyResults = {}; if(!partial) KEYS.forEach(k=>{ const r = keyState(k,"final"); if(r.st!=="nodata") keyResults[k.id] = r.st; });
  const d = partial ? null : decidingKey(), cov = coverage();
  const row = { id:g.id, us:g.us, opp:g.opp, role:g.role, tier:g.tier, score:{...g.score}, result: partial ? "H" : outcome(), partial:!!partial,
    snaps:off.length+def.length, offN:off.length, defN:def.length, agg:{off:aggOf(off), def:aggOf(def)}, keyResults, picked:g.picked.slice(),
    deciding:d?d.id:null, pickedDeciding:!!(d&&d.mine), cov:{n:cov.n,total:cov.total,us:cov.us,opp:cov.opp},
    story: partial ? `First half: ${usN()} ${g.score.us}, ${oppN()} ${g.score.opp}.` : story(), when:Date.now() };
  const i = S.season.findIndex(x=>x.id===g.id);
  if(i>=0) S.season[i] = row; else S.season.push(row);
  if(partial) g.halfLocked = true; else g.locked = true;
  save(); if(!partial) renderFinalReport();
}
function showCard(){
  const g = G(), d = decidingKey(), off = plays(s=>s.pos==="us"), cnt = countBy(off,s=>s.grp), cov = coverage();
  const mix = off.length ? `<div class="pc-mix">${OFF.filter(k=>cnt[k]).map(k=>`<i style="width:${cnt[k]/off.length*100}%;background:${MIXC[k]}"></i>`).join("")}</div>
      <div class="pc-leg">${OFF.filter(k=>cnt[k]).map(k=>`<span><i style="background:${MIXC[k]}"></i>${k} ${pct(cnt[k]/off.length)}</span>`).join("")}</div>` : "";
  const el = document.getElementById("card");
  el.innerHTML = `<div class="row" style="max-width:460px;margin:0 auto"><span class="grow hint">Screenshot this card for the group chat.</span><button class="x" onclick="hideCard()">Close</button></div>
    <div class="pc">
      <div class="top">${logoSVG("c")}<div class="hd">Final. ${esc(g.role==="Pick'em"?"Pick'em":"Listed "+g.role.toLowerCase())}, ${esc(g.tier)} opponent</div></div>
      <div class="sc"><span class="t"><span class="ab" style="background:${esc(g.usColors[0])};color:${inkOn(g.usColors[0])}">${esc(usA())}</span>${g.score.us}</span><span class="t">${g.score.opp}<span class="ab" style="background:${esc(g.oppColor)};color:${inkOn(g.oppColor)}">${esc(oppA())}</span></span></div>
      <div class="story">${esc(story())}</div>
      ${mix}
      ${g.picked.map(id=>{ const k=KEY[id], r=keyState(k,"final"); return `<div class="kl"><span>${esc(k.title(thOf(k)))}</span><span class="st ${r.st}">${ST_LABEL[r.st]}</span></div>`; }).join("")}
      ${d ? `<div class="kl"><span><b>Deciding Key</b></span><span>${esc(KEY[d.id].short)}</span></div>` : ""}
      <div class="by">Charted on xO Football${S.profile.name ? " by "+esc(S.profile.name) : ""}. ${plays().length} snaps. ${esc(coverageLine())}</div>
      ${SPONSOR ? `<div class="pc-spons">${sponsorChip()}</div>` : ""}
    </div>`;
  el.classList.add("on");
}

/* ---------- Film Room ---------- */
function renderFilm(){
  const P = S.profile, r = rankNow(), R = rankReqs(), g0 = G();
  const next = r < RANKS.length ? R[r] : [];
  const doneN = next.filter(q=>q.ok).length;
  const games = S.season.filter(x=>FILMTIER==="All" || x.tier===FILMTIER);
  const W = games.filter(x=>x.result==="W").length, L2 = games.filter(x=>x.result==="L").length;
  const eyeN = S.season.filter(x=>x.deciding && x.picked && x.picked.length).length, eyeY = S.season.filter(x=>x.pickedDeciding).length;
  const kt = KEYS.map(k=>({k, rec:keyRecord(k.id, FILMTIER==="All"?null:FILMTIER)})).filter(x=>x.rec.n).sort((a,b)=>b.rec.rate-a.rec.rate);
  const live = !g0.locked && plays().length && (FILMTIER==="All" || g0.tier===FILMTIER) && !S.season.some(x=>x.id===g0.id);
  const agg = side => { const t = {}; const add = a => { for(const k in a){ const o=t[k]=t[k]||{n:0,run:0}; o.n+=a[k].n; o.run+=a[k].run; } };
      games.forEach(x=>{ if(x.agg && x.agg[side]) add(x.agg[side]); });
      if(live) add(aggOf(plays(s=>s.pos===(side==="off"?"us":"opp"))));
      return t; };
  const tend = (side, list, who) => { const t = agg(side), tot = Object.values(t).reduce((s,o)=>s+o.n,0);
    if(!tot) return emptyState(side==="off"?glyphOff("11"):glyphDef("Nickel"), side==="off"?"No offensive snaps yet":"No defensive snaps yet", "Chart a game and the mix shows up here, even before you lock it.");
    return `<div class="mix big">${list.map(k=>t[k]?`<i style="width:${t[k].n/tot*100}%;background:${MIXC[k]}"></i>`:"").join("")}</div>
      <div class="legend">${list.filter(k=>t[k]).map(k=>`<div><i style="background:${MIXC[k]}"></i><b>${k}</b><span>${pct(t[k].n/tot)} of snaps, ${who} ${pct(t[k].run/t[k].n)}</span></div>`).join("")}</div>`; };
  document.getElementById("filmOut").innerHTML = `
    ${pageHead("Film Room", r ? `Rank: ${esc(RANKS[r-1].n)}` : "Unranked. Chart a full game to start the climb.")}
    <h3>Tendencies</h3>
    ${live ? `<p class="hint" style="margin-top:-2px">Includes this game, not locked yet.</p>` : ""}
    <div class="card"><div class="eyebrow">${esc(G().us)} offense</div>${tend("off", OFF, "run")}</div>
    <div class="card"><div class="eyebrow">Your defense</div>${tend("def", DEF, "they ran")}</div>
    <h3>Season</h3>
    <div class="card">
      <div class="seg">${["All",...TIERS].map(t=>`<button class="chip ${FILMTIER===t?"on":""}" onclick="setFilmTier('${t}')">${t}</button>`).join("")}</div>
      ${games.length ? `<div class="recbig"><b>${W}–${L2}</b><span>${FILMTIER==="All"?"this season":"vs "+FILMTIER}</span></div>
        ${eyeN ? `<p class="hint">Your three keys included the Deciding Key in ${eyeY} of ${eyeN} games.</p>` : ""}
        ${games.slice().reverse().map(x=>`<div class="grow-row"><span class="wl ${x.result}">${x.result==="H"?"½":x.result}</span><div><b>${x.score.us}–${x.score.opp} vs ${esc(x.opp)}${x.partial?" (first half)":""}</b><small>${esc(x.tier)}. ${esc(x.story||"")}${x.cov?` Charted ${x.cov.n} of ${x.cov.total} possessions.`:""}</small></div></div>`).join("")}`
        : emptyState(glyphOff("11"), "Your season starts here", "Save a first half at halftime or lock the game from the Final, and it lands in your book.")}
    </div>
    <h3>Key Tracker</h3>
    <div class="card">${kt.length ? kt.map(x=>`<div class="ktr"><b>${esc(x.k.short)}</b><span class="pillw">Won it ${x.rec.wW}–${x.rec.wL}</span><span class="pilll">Lost it ${x.rec.lW}–${x.rec.lL}</span></div>`).join("")
        + `<p class="hint" style="margin-top:8px">${esc(G().us)}'s record when winning or losing each key. Small samples: don't generalize from one game.</p>`
      : emptyState(glyphDef("4 DB"), "No key records yet", "Every locked game grades every key, so you learn which ones really decide your games.")}</div>
    <h3>The ladder</h3>
    <div class="card ladder-card">
      ${ladderSVG(r)}
      ${r < RANKS.length ? `<div class="nextup"><div class="eyebrow">Next: ${esc(RANKS[r].n)}</div>
        <div class="bar"><i style="width:${next.length?doneN/next.length*100:0}%"></i></div>
        <ul class="reqs">${next.map(q=>`<li class="${q.ok?"ok":""}">${q.ok?"✓":"○"} ${esc(q.t)}</li>`).join("")}</ul>
        <p class="hint">${esc(RANKS[r].adds)}.</p></div>` : `<p><b>Head Coach.</b> The top of the Staff.</p>`}
      <label class="lab" for="pName">Your name for bylines</label>
      <input class="f" id="pName" value="${esc(P.name)}" placeholder="Nate B." onchange="setName(this.value)">
    </div>
    <h3>Installs and walkthroughs</h3>
    ${[["pers","Offensive personnel","Read 11, 10, 12 and 21 before the camera cuts.",glyphOff("12")],
       ["pkg","Defensive packages","Count the DBs: 4 DB, Nickel, Dime, Goal line.",glyphDef("Nickel")],
       ["tend","Reading a tendency","Base, deviation, and what a Tendency Alert means.",glyphOff("21")]].map(([id,t,d,svg])=>`
      <div class="card inst"><div class="thumb">${svg}</div><div class="grow">
        <div class="row"><b class="grow">${t}</b><span class="st ${P.install[id]?"won":"nodata"}">${P.install[id]?"✓ Installed":"Not yet"}</span></div>
        <p class="hint" style="margin:2px 0 8px">${d}${id!=="tend" && P.walk[id] ? ` Best walkthrough: ${P.walk[id]} of 10.` : ""}</p>
        <div class="row"><button class="btn grow" onclick="openInstall('${id}')">Install</button>${id!=="tend"?`<button class="btn grow" onclick="startWalk('${id}')">Walkthrough</button>`:""}</div>
      </div></div>`).join("")}
    <div class="foot"><span>Your book lives on this device.</span><button class="link" onclick="copyBackup()">Back up my book</button><button class="link" onclick="restoreSheet()">Restore</button></div>
    ${helpFooter()}`;
}

/* ---------- Backup and restore ---------- */
function backupName(){ const d = new Date(); return `xo-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`; }
async function copyBackup(){
  const txt = JSON.stringify(S), name = backupName();
  try{
    const file = new File([txt], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"xO Football backup"}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  if(HOSTED){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); return; }
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert("Backup copied. Paste it somewhere safe, like a note.")).catch(()=>showBackup(txt)); else showBackup(txt);
}
function showBackup(txt){
  openSheet(`<div class="sheet-h"><h3>Backup</h3><button class="x" onclick="closeSheet()">Close</button></div><p class="hint">Select all and copy.</p><textarea class="f" style="min-height:200px">${esc(txt)}</textarea>`);
}
let PENDING = null;
function restoreSheet(){
  PENDING = null;
  openSheet(`<div class="sheet-h"><h3>Restore</h3><button class="x" onclick="closeSheet()">Close</button></div>
    <label class="lab" for="rFile" style="margin-top:0">Pick a backup file</label>
    <input class="f" id="rFile" type="file" accept=".json,application/json" onchange="restoreFile(this)">
    <label class="lab" for="rTxt">Or paste a backup</label>
    <textarea class="f" id="rTxt" style="min-height:110px"></textarea>
    <button class="btn block" style="margin-top:8px" onclick="previewRestore(document.getElementById('rTxt').value)">Check this backup</button>
    <div id="rPrev" style="margin-top:10px"></div>`);
}
function restoreFile(inp){ const f = inp.files && inp.files[0]; if(f) f.text().then(previewRestore); }
function previewRestore(txt){
  const el = document.getElementById("rPrev"); if(!el) return;
  try{
    const s = JSON.parse(txt); if(!s || !s.game || !Array.isArray(s.season)) throw 0;
    PENDING = s; const last = s.season[s.season.length-1], n = s.season.length, m = S.season.length;
    el.innerHTML = `<div class="card"><b>${n} game${n===1?"":"s"} in this backup</b>
      <p class="hint">${last ? `Most recent: ${esc(last.us)} vs ${esc(last.opp)}, ${last.score.us}–${last.score.opp}. ` : ""}This replaces the ${m} game${m===1?"":"s"} on this phone.</p>
      <button class="btn pri block" onclick="doRestore()">Replace my book with this backup</button></div>`;
  }catch(e){ PENDING = null; el.innerHTML = `<p class="hint">That doesn't look like an xO Football backup.</p>`; }
}
function doRestore(){ if(!PENDING) return; S = Object.assign(blank(), PENDING); S.firstRun = false; PENDING = null; save(); closeSheet(); go("film"); }

/* ---------- Welcome and feedback ---------- */
function welcome(){
  const g = G();
  const opts = sel => TEAMS.map((t,i)=>`<option value="${i}" ${t[0]===sel?"selected":""}>${esc(t[0])}</option>`).join("");
  openSheet(`<div class="welcome">
    <div class="w-logo">${logoSVG("w")}</div>
    <h2>Watch the game like a coach</h2>
    <p>xO Football turns your phone into a coach's chart. You log what you see, snap by snap, and it tells you how the game is really being won.</p>
    <div class="w-steps">
      <div><i class="sn on">1</i><div><b>Scouting</b><span>Three Keys to the Game are suggested for your matchup. Keep them or swap them.</span></div></div>
      <div><i class="sn on">2</i><div><b>Live</b><span>Every snap: personnel before it, the play after it, the result if you caught it.</span></div></div>
      <div><i class="sn on">3</i><div><b>Halftime and Final</b><span>Your keys get graded, and your film is held up against the box score.</span></div></div>
      <div><i class="sn on">4</i><div><b>Film Room</b><span>Save the game to your book and climb the ladder from Student Assistant to Head Coach.</span></div></div>
    </div>
    <p class="hint">New to "11 personnel"? The two-minute install teaches it with pictures.</p>
    <button class="btn block" onclick="openInstall('pers')">Take the two-minute install</button>
    <label class="lab" for="wTeam" style="margin-top:14px">Who do you root for?</label>
    <select class="f" id="wTeam"><option value="">Choose your team…</option>${opts(S.firstRun ? "" : g.us)}</select>
    <label class="lab" for="wOpp">Who are they playing next?</label>
    <select class="f" id="wOpp"><option value="">Choose the opponent…</option>${opts(g.opp)}</select>
    <button class="btn pri block" style="margin-top:12px" onclick="finishWelcome()">Let's go</button>
    <p class="hint" style="margin-top:10px">Everything you chart stays on this phone. Nothing is sent anywhere. ${XO_VERSION}.</p>
  </div>`);
}
function finishWelcome(){
  const a = document.getElementById("wTeam").value, b = document.getElementById("wOpp").value;
  if(a!=="") pickTeam("us", a);
  if(b!=="") pickTeam("opp", b);
  S.firstRun = false; save(); closeSheet(); go("scout");
}
function sendFeedback(){
  const g = G(), off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp"), all = plays();
  const tagged = all.filter(s=>s.res).length, ts = all.map(s=>s.t).filter(Boolean), cov = coverage();
  const mins = ts.length>1 ? Math.round((Math.max(...ts)-Math.min(...ts))/60000) : null;
  const text = `xO Football feedback (${XO_VERSION})
Game: ${g.us||"?"} vs ${g.opp||"?"}
Charted: ${all.length} snaps (${off.length} offense, ${def.length} defense). ${coverageLine()}
Results tagged on ${all.length ? Math.round(tagged/all.length*100) : 0}% of snaps
Keys: ${g.picked.map(id=>KEY[id].short).join(", ") || "none"}${mins!=null ? `\nTime charting: about ${mins} minutes` : ""}

1. Did you chart the whole game? If not, when did you stop?
2. What was slow or confusing on the Live screen?
3. Did Halftime or the Final tell you something you didn't already know?
4. Anything else:
`;
  if(navigator.share){ navigator.share({title:"xO Football feedback", text}).catch(()=>{}); }
  else { location.href = "sms:?&body=" + encodeURIComponent(text); }
}

/* ---------- sheet + tabs ---------- */
function openSheet(html){ document.getElementById("sheetIn").innerHTML = html; document.getElementById("sheet").classList.add("on"); document.getElementById("scrim").classList.add("on"); document.getElementById("sheet").scrollTop = 0; }
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); document.getElementById("scrim").classList.remove("on"); }
const RENDER = {scout:renderScout, live:renderLive, half:renderHalf, final:renderFinal, film:renderFilm};
function go(t){
  S.tab = t; save(); hideCard(); applyColors();
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="p-"+t));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  RENDER[t](); window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.t)));
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeSheet(); hideCard(); } });
let SAMPLE = null, CAN_IMG = false, IMG_TYPES = "image/*";
(async () => {
  try{
    if(!window.claude || !window.claude.use) return;
    const smp = await window.claude.use("sample");
    if(!smp) return;
    const lim = await smp.limits().catch(()=>null);
    if(lim && lim.images){ SAMPLE = smp; CAN_IMG = true; if(lim.images.mediaTypes) IMG_TYPES = lim.images.mediaTypes.join(","); }
    if(S.tab==="half") renderHalf(); if(S.tab==="final") renderFinal(); if(S.tab==="scout") renderScout();
  }catch(e){}
})();
go(S.tab || "scout");
loadSeason();
if(S.firstRun) welcome();
</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
