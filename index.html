<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13274F">
<title>xO Football</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="xO Football">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Every color below is generated from the team's three colors (see applyColors). */
:root{
  --bg:var(--l-bg,#F4F5F7); --surf:var(--l-surf,#FFFFFF); --surf2:var(--l-surf2,#ECEEF1); --ink:var(--l-ink,#16181C);
  --muted:var(--l-muted,#5F646C); --line:var(--l-line,#D8DCE1); --board:var(--l-board,#FFFFFF);
  --us:var(--l-id,#E07000); --us-ink:var(--l-idink,#1C1D20); --us-line:var(--l-id,#E07000); --us-soft:var(--l-soft,rgba(224,112,0,.14));
  --hi:var(--l-act,#FF8200); --hi-ink:var(--l-actink,#1C1D20); --emph:var(--l-emph,#E07000);
  --chalk:var(--ink); --opp:#5E6B78; --opp-ink:#FFFFFF;
  --good:#17804A; --bad:#C62D24; --warn:#9A6700;
  --x:#CE1141; --o:#13274F;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:var(--d-bg,#1B1C1E); --surf:var(--d-surf,#26272A); --surf2:var(--d-surf2,#2D2E31); --ink:var(--d-ink,#F5F3EE);
    --muted:var(--d-muted,#A9AAAD); --line:var(--d-line,#3E3F42); --board:var(--d-board,#212224);
    --us:var(--d-id,#FF8200); --us-ink:var(--d-idink,#1C1D20); --us-line:var(--d-id,#FF8200); --us-soft:var(--d-soft,rgba(255,130,0,.16));
    --hi:var(--d-act,#FFFFFF); --hi-ink:var(--d-actink,#1C1D20); --emph:var(--d-emph,#FF8200);
    --good:#6FD58A; --bad:#FF7A6B; --warn:#FFC94A; --o:#EAAA00;
  }
}
:root[data-theme="dark"]{
  --bg:var(--d-bg,#1B1C1E); --surf:var(--d-surf,#26272A); --surf2:var(--d-surf2,#2D2E31); --ink:var(--d-ink,#F5F3EE);
  --muted:var(--d-muted,#A9AAAD); --line:var(--d-line,#3E3F42); --board:var(--d-board,#212224);
  --us:var(--d-id,#FF8200); --us-ink:var(--d-idink,#1C1D20); --us-line:var(--d-id,#FF8200); --us-soft:var(--d-soft,rgba(255,130,0,.16));
  --hi:var(--d-act,#FFFFFF); --hi-ink:var(--d-actink,#1C1D20); --emph:var(--d-emph,#FF8200);
  --good:#6FD58A; --bad:#FF7A6B; --warn:#FFC94A; --o:#EAAA00;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.45 var(--body);min-height:100%;
  padding-bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.08;letter-spacing:-.01em}
h2{font-size:30px;margin:16px 0 4px}
h3{font-size:20px;margin:22px 0 8px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{display:none}
.panel.on{display:block}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.btn{border:1.5px solid var(--line);background:var(--surf);border-radius:10px;padding:10px 12px;font-weight:700;min-height:44px}
.btn.pri{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.lab{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.f{width:100%;border:1px solid var(--line);background:var(--surf2);border-radius:8px;padding:9px 10px;min-height:42px}
textarea.f{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lines p{padding:6px 0;border-bottom:1px solid var(--line);margin:0}
.lines p:last-child{border-bottom:0}

/* brand */
.brandband{background:var(--band,#FF8200);color:var(--band-ink,#15171A);margin:0 -14px;padding:16px 14px 18px}
.brandband .brand{margin:0}
.brandband .brand .wm,.brandband .brand .tag,.brandband .brand .wm .fb{color:var(--band-ink,#15171A)}
.brandband .brand .tag{opacity:.85}
.brand{display:flex;align-items:center;gap:12px;margin:14px 0 2px}
.brand svg{width:54px;height:54px;flex:none;border-radius:13px;box-shadow:0 6px 18px rgba(19,39,79,.28)}
.brand .wm{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em}
.brand .wm .fb{color:var(--ink);font-weight:700;margin-left:6px}
.brand .wm .wx,.brand .wm .wo{color:inherit}
.brand .tag{font-size:14px;color:var(--muted);font-weight:600}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav,#2A2B2E);border-top:0;
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:0;border:0;padding:10px 2px 12px;font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--nav-ink,#fff);opacity:.72;min-height:54px}
nav.tabs button.on{opacity:1;color:var(--nav-hi,#fff);box-shadow:inset 0 3px 0 var(--nav-hi,#fff)}

/* live header */
.live-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band,#FF8200);color:var(--band-ink,#15171A);padding:8px 0 10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sbteam{display:flex;align-items:center;gap:10px;background:0;border:0;padding:2px 0;min-height:48px;color:var(--band-ink,#15171A)}
.sbteam.r{justify-content:flex-end}
.sbteam .ab{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.02em;padding:3px 7px;border-radius:6px;line-height:1}
.sbteam .ab.us{background:var(--band-ink,#15171A);color:var(--band,#FF8200)}
.sbteam .ab.opp{background:var(--opp);color:var(--opp-ink)}
.sbteam .pts{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.qsel{border:1.5px solid color-mix(in srgb,var(--band-ink,#000) 35%,transparent);background:color-mix(in srgb,var(--band-ink,#000) 12%,transparent);color:var(--band-ink,#15171A);border-radius:10px;padding:6px 8px;font-family:var(--display);font-weight:700;min-height:42px}
.poss{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.poss button{border:1.5px solid color-mix(in srgb,var(--band-ink,#000) 35%,transparent);background:color-mix(in srgb,var(--band-ink,#000) 10%,transparent);color:var(--band-ink,#15171A);border-radius:10px;min-height:44px;font-weight:700;font-size:15px}
.poss button.us.on{background:var(--surf);border-color:var(--surf);color:var(--ink)}
.poss button.opp.on{background:var(--opp);border-color:var(--opp);color:var(--opp-ink)}
.cap{margin-top:8px;min-height:38px;color:var(--ink);font-size:14.5px;line-height:1.3;padding:7px 10px;border-radius:10px;background:var(--surf);border-left:4px solid var(--line)}
.cap.alert{border-left-color:var(--emph);background:var(--surf2);position:relative}
.loop{position:absolute;left:-8px;top:-7px;width:calc(100% + 16px);height:calc(100% + 14px);pointer-events:none;overflow:visible}
.loop path{fill:none;stroke:var(--emph);stroke-width:2.6;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .75s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.loop path{animation:none;stroke-dashoffset:0}}
.circled{position:relative;display:inline-block;padding:5px 12px}
.cap.alert b:first-child{color:var(--emph)}
.side-lab{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 6px;font-size:14px;font-weight:700;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1.5px solid var(--line);background:var(--board);border-radius:12px;padding:6px 8px 7px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile svg{width:100%;height:auto;display:block;max-height:110px}
.tile .nm{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;letter-spacing:-.02em}
.tile .sub{font-size:12px;color:var(--muted);line-height:1.2;font-weight:600}
.tile .tt{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.tile.on{border-color:var(--us);box-shadow:0 0 0 2px var(--us), 0 0 18px var(--us-soft);background:linear-gradient(var(--us-soft),var(--us-soft)),var(--board)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.acts button{border:1.5px solid var(--line);background:var(--surf);border-radius:10px;min-height:44px;font-weight:700;font-size:15px}
.acts button:active{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.res-lab{display:flex;align-items:center;gap:8px;margin:8px 0 5px;font-size:13px;font-weight:700;color:var(--muted)}
.qm{border:1px solid var(--line);background:var(--surf2);border-radius:999px;width:24px;height:24px;font-size:13px;font-weight:700;line-height:1;padding:0}
.resgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.resgrid .chip{padding:5px 4px;text-align:center;min-height:36px;font-size:13.5px}
.resgrid .wide{grid-column:span 2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chips .k{font-size:13px;color:var(--muted);font-weight:700;margin-right:2px}
.chip{border:1.5px solid var(--line);background:var(--surf2);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:700;min-height:38px}
.chip.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.chip.td.on{background:var(--good);border-color:var(--good);color:#06170C}
.chip.bad.on{background:var(--bad);border-color:var(--bad);color:#fff}
.ctrl{display:grid;grid-template-columns:auto auto 1fr;gap:6px;margin-top:10px}
.strip{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.kp{font-size:12.5px;font-weight:700;border-radius:6px;padding:4px 8px;background:var(--surf2);color:var(--muted)}
.kp.on{color:var(--good)} .kp.off{color:var(--bad)} .kp.close{color:var(--warn)}
.stats{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.stats b{color:var(--ink)}
.log div{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:8px}
.log div:last-child{border-bottom:0}
.log .tag{font-family:var(--display);font-weight:800;font-size:13px;min-width:48px}
.log .o{color:var(--us-line)} .log .d{color:var(--x)}

/* keys */
.key{border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.key.pick{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi)}
.key .t{font-weight:700;line-height:1.25}
.key .s{font-size:13px;color:var(--muted);grid-column:1/2}
.key .pk{grid-row:1/3;grid-column:2;align-self:center}
.step{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.step button{border:1px solid var(--line);background:var(--surf2);border-radius:6px;width:34px;height:30px;font-weight:700}
.st{font-weight:700;font-size:13px;border-radius:6px;padding:3px 8px;white-space:nowrap;align-self:start}
.st.won,.st.on{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st.lost,.st.off{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.st.close{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.nodata{background:var(--surf2);color:var(--muted)}
.kr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kr:last-child{border-bottom:0}
.kr .v{font-size:13px;color:var(--muted);grid-column:1/2}

/* tale of the tape */
.tape{width:100%;border-collapse:collapse;font-size:15px}
.tape td{padding:7px 2px;border-top:1px solid var(--line);text-align:center}
.tape tr:first-child td{border-top:0}
.tape td.lbl{color:var(--muted);font-size:13px;font-weight:700}
.tape td.v{font-family:var(--display);font-weight:700;font-size:18px;width:28%;font-variant-numeric:tabular-nums}
.tape td.v.win{color:var(--emph);font-weight:800}
.tape .hd td{font-family:var(--display);font-weight:800;font-size:15px;padding-bottom:8px}
.tape .hd .us{color:var(--us-line)} .tape .hd .opp{color:var(--muted)}
.src{font-size:12.5px;color:var(--muted);margin-top:8px}
table.raw{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.raw td{padding:3px 0;border-top:1px solid var(--line)}
table.raw td:first-child{color:var(--muted);font-weight:600}
table.raw input{width:70px;text-align:right;border:1px solid var(--line);background:var(--surf2);border-radius:6px;padding:5px;min-height:34px;float:right}
.tsel{appearance:none;-webkit-appearance:none;width:100%;text-align:center;text-align-last:center;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;background:transparent;font-family:var(--display);font-weight:700;font-size:18px;padding:4px 2px;min-height:40px;color:inherit;cursor:pointer}
.tsel:focus-visible{outline:2px solid var(--hi)}
.tape td.v.win .tsel{color:var(--emph);font-weight:800}
.recsel{display:flex;align-items:center;justify-content:center;gap:2px}
.recsel .tsel{width:auto;min-width:36px}
.tsel.mini{display:inline-block;width:auto;font-size:13px;min-height:30px;padding:0 4px;font-family:var(--body)}
/* team colors */
.cpick{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.cpick input{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surf2)}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surf);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.sw input[type=color]{width:30px;height:30px;border:0;padding:0;background:0;border-radius:50%}

/* box score */
table.box{width:100%;border-collapse:collapse;font-size:14px}
table.box th{text-align:right;font-family:var(--display);font-size:15px;font-weight:800;padding:4px}
table.box th:first-child{text-align:left}
table.box td{padding:3px 0;border-top:1px solid var(--line)}
table.box td:first-child{color:var(--muted);font-weight:600;padding-right:6px}
table.box input{width:74px;text-align:right;border:1px solid var(--line);background:var(--surf2);border-radius:6px;padding:6px;min-height:36px;float:right}

.final-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:clamp(24px,7.5vw,38px);white-space:nowrap}
.final-score span:last-child{text-align:right}
.final-score .res{font-size:18px;padding:5px 10px;border-radius:8px;background:var(--hi);color:var(--hi-ink)}

/* ladder */
.rung{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.rung:last-child{border-bottom:0}
.rung .n{font-family:var(--display);font-weight:800;font-size:19px;color:var(--muted);text-align:center}
.rung.done .n{color:var(--good)}
.rung.cur{background:color-mix(in srgb,var(--hi) 12%,transparent);margin:0 -14px;padding:9px 14px}
.rung .nm{font-family:var(--display);font-weight:700;font-size:19px}
.rung .rq{font-size:13.5px;color:var(--muted)}
.rank-now{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;color:var(--us)}
.mix{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--surf2);margin:6px 0}
.mix i{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:4px 4px 4px 0}
.tbl td{padding:6px 4px 6px 0;border-top:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(5,9,20,.6);z-index:40;display:none}
#scrim.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surf);border-radius:16px 16px 0 0;
  max-height:88%;overflow:auto;display:none;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#sheet.on{display:block}
#sheet .in{max-width:640px;margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-h h3{margin:0}
.x{border:1px solid var(--line);background:var(--surf2);border-radius:8px;min-height:40px;padding:6px 12px;font-weight:700}
.gl-big svg{width:100%;height:auto;display:block;background:var(--board);border:1px solid var(--line);border-radius:12px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.answer button{min-height:54px;border:1.5px solid var(--line);background:var(--surf);border-radius:12px;font-family:var(--display);font-weight:800;font-size:22px}
.answer button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.answer button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.lesson-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.lesson-g div{border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--board)}
.lesson-g svg{width:100%;height:52px;display:block}
.lesson-g b{font-family:var(--display);font-weight:800;font-size:20px}
.res-help p{margin:0 0 10px}

/* postgame card */
#card{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#card.on{display:block}
.pc{max-width:460px;margin:12px auto;background:#13274F;color:#F4F1E8;border-radius:18px;padding:18px;position:relative;overflow:hidden;
  background-image:radial-gradient(ellipse 70% 50% at 20% 0%, rgba(244,241,232,.08), transparent 70%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.pc .top{display:flex;align-items:center;gap:10px}
.pc .top svg{width:40px;height:40px}
.pc .hd{font-size:13px;font-weight:700;color:#9CA9C6}
.pc .sc{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(28px,9.5vw,44px);white-space:nowrap;margin:14px 0 6px}
.pc .sc .t{display:flex;align-items:center;gap:8px}
.pc .sc .ab{font-size:.45em;padding:4px 7px;border-radius:6px}
.pc .story{font-weight:700;font-size:17px;margin:8px 0 12px}

<script>

/* ---------- state ---------- */
const LS = "xo-v9";
function freshGame(prev, first){
  return {
    id:"g"+Date.now(),
    us: prev ? prev.us : "Tennessee", usAb: prev ? prev.usAb : "TENN",
    usColors: prev && prev.usColors ? prev.usColors.slice() : ["#FF8200","#FFFFFF","#58595B"], oppColor: first ? "#BF5700" : "#5E6B78",
    opp: first ? "Texas" : "", oppAb: first ? "TEX" : "",

function blank(){

function load(){
  try{

const G = () => S.game;

/* ---------- helpers ---------- */

const usN = () => G().us || "Us";
const oppN = () => G().opp || "Opponent";

function countBy(list, f){ const c={}; list.forEach(x=>{ const k=f(x); if(k!=null) c[k]=(c[k]||0)+1; }); return c; }

function plays(filter){ return G().snaps.filter(s=>!s.st && (!filter || filter(s))); }
function runRate(list){ return list.length ? list.filter(s=>isRun(s.act)).length/list.length : 0; }

/* ---------- brand + team colors ---------- */
let LOGO = {bg:"#13274F", bg2:"#0E1F42", x:"#CE1141", o:"#EAAA00", line:"#FFFFFF"};
function logoColors(cols){
  const [P,S,T] = cols, bg = P, ink = inkOn(P);
  const acc = c => contrast(c,bg) >= 2.8 ? c : ink;
  return {bg, bg2:mixHex(bg,"#000000",0.08), x:acc(S), o:acc(T), line:ink};
}
const logoSVG = k => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="bg-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${LOGO.bg}"/><stop offset="1" stop-color="${LOGO.bg2}"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#bg-${k})"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M116.0 168.0 L162.6 156.5 M189.8 149.8 L236.4 138.3 M263.6 131.6 L310.2 120.1 M337.4 113.4 L384.0 101.9" stroke="${LOGO.line}" stroke-width="24"/><path d="M133 216 L199 282 M199 216 L133 282" stroke="${LOGO.x}" stroke-width="38"/><circle cx="324" cy="226" r="57" stroke="${LOGO.o}" stroke-width="36"/><path d="M154 362 Q296 398 390 342" stroke="${LOGO.line}" stroke-width="32"/><path d="M346.3 336.5 L390 342 L374.1 383.0" stroke="${LOGO.line}" stroke-width="32"/></g></svg>`;
function hexRgb(h){ h=String(h||"#888").replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16)||0; return [n>>16&255,n>>8&255,n&255]; }
function lum(c){ const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}; return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2]); }
const mixc = (a,b,t) => a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const toHex = a => "#"+a.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("").toUpperCase();
const mixHex = (a,b,t) => toHex(mixc(hexRgb(a),hexRgb(b),t));
const L = h => lum(hexRgb(h));
const contrast = (a,b) => { const x=L(a), y=L(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
const inkOn = hex => contrast(hex,"#FFFFFF") >= contrast(hex,"#15171A") ? "#FFFFFF" : "#15171A";
function sat(h){ const [r,g,b]=hexRgb(h).map(v=>v/255), mx=Math.max(r,g,b), mn=Math.min(r,g,b); return mx===mn?0:(mx-mn)/(1-Math.abs(mx+mn-1)); }
function push(hex, bg, target, dark){ let c=hex, i=0; while(contrast(c,bg)<target && i++<16) c = mixHex(c, dark?"#FFFFFF":"#000000", .1); return c; }
/* Build a full light or dark palette from a team's three colors */
function buildTheme(cols, dark){
  const [P,S,T] = cols, byL = cols.slice().sort((a,b)=>L(a)-L(b)), t = {};
  if(dark){
    let bg = L(byL[0]) <= 0.12 ? mixHex(byL[0],"#000000",0.5) : mixHex(P,"#000000",0.82);
    let k=0; while(L(bg)>0.018 && k++<12) bg = mixHex(bg,"#000000",0.18);
    t.bg=bg; t.surf=mixHex(bg,"#FFFFFF",0.07); t.surf2=mixHex(bg,"#FFFFFF",0.11); t.board=mixHex(bg,"#FFFFFF",0.04);
    t.line=mixHex(bg,"#FFFFFF",0.18); t.ink="#F5F3EE"; t.muted=mixHex(bg,"#FFFFFF",0.64);
  } else {
    const bg = "#F4F5F7";
    t.bg=bg; t.surf="#FFFFFF"; t.surf2="#ECEEF1"; t.board="#FFFFFF"; t.line="#D8DCE1";
    t.ink=mixHex("#16181C", byL[0], 0.08); t.muted="#5F646C";
  }
  const bg = t.bg;
  let idSrc = [P,S,T].find(c=>contrast(c,bg)>=1.6) || P;
  if(dark && contrast(idSrc,bg) < 2.2){ const vivid = [S,T].find(c=>contrast(c,bg)>=4 && sat(c)>=0.5); if(vivid) idSrc = vivid; }
  t.id = push(idSrc, bg, dark ? 3.6 : 3, dark); t.idink = inkOn(t.id);

  const act = dark ? (order.find(c=>c!==idSrc && contrast(c,bg)>=2.2) || order.find(c=>contrast(c,bg)>=2.2) || t.id)
                   : (order.find(c=>contrast(c,bg)>=2.2) || t.id);
  t.act = act;
  t.actink = [P,S,T].filter(c=>c!==act).find(c=>contrast(c,act)>=4.5) || inkOn(act);
  const rest = [P,S,T].filter(c=>c!==idSrc && c!==act).sort((a,b)=>sat(b)-sat(a))[0];
  t.emph = rest && sat(rest)>=0.3 && contrast(rest,bg)>=1.6 ? push(rest,bg,3,dark) : t.id;
  return t;
}
function applyColors(){

function tapeTh(id, g){

  const n = (side,f) => { const v = T[side] && T[side][f]; return v===""||v==null||isNaN(+v) ? null : +v; };
  let v = null, p;
  if(id==="runD" && (p=n("opp","ypc"))!=null) v = Math.floor((p-0.3)*2)/2;
  if(id==="runO" && (p=n("us","ypc"))!=null) v = Math.round(p*2)/2;
  if(id==="thirdD" && (p=n("opp","third"))!=null) v = Math.floor((p-5)/5)*5;
  if(id==="thirdO" && (p=n("us","third"))!=null) v = Math.round(p/5)*5;
  if(id==="rzD" && (p=n("opp","rz"))!=null) v = Math.floor((p-10)/10)*10;

function pushAlert(id, text){

  const dev = (list, who, what) => {
    if(list.length < 12) return;
    const recent = list.slice(-7), base = mode(list.slice(0,-7), s=>s.grp);
    if(!base) return;
    const c = countBy(recent, s=>s.grp);
    for(const k in c){
      if(k!==base.k && c[k]>=4) pushAlert(`dev:${who}:${k}:${Math.floor(list.length/15)}`,
        `${what} out of the base: ${k} on ${c[k]} of the last 7 snaps. Base has been ${base.k}.`);
    }
  };
  dev(off, "off", `${usN()} offense`);
  dev(def, "def", "Your defense");
  const shift = (list, who, team) => {
    if(list.length < 16) return;
    const recent = list.slice(-8), prior = list.slice(0,-8);
    const rr = runRate(recent), rp = runRate(prior), runs = recent.filter(s=>isRun(s.act)).length;
    const b = Math.floor(list.length/10);
    if(rr - rp >= 0.35) pushAlert(`run:${who}:${b}`, `${team} is leaning on the run: ${runs} of the last 8 snaps, up from ${pct(rp)}.`);
    if(rp - rr >= 0.35) pushAlert(`pass:${who}:${b}`, `${team} has gone to the air: ${8-runs} passes in the last 8, up from ${pct(1-rp)}.`);
  };
  shift(off, "off", usN());
  shift(def, "def", oppN());
  const last = g.snaps[g.snaps.length-1];
  if(last && last.pos==="opp"){
    const drive = def.filter(s=>s.series===last.series).length;
    if(drive>=10) pushAlert(`drive:${last.series}`, `Long drive: your defense has been on the field for ${drive} straight snaps.`);

  return g.picked.map(id=>{ const k=KEY[id], r=keyState(k,ph);
    return `<div class="kr"><span>${esc(k.title(thOf(k)))}</span><span class="st ${r.st}">${ST_LABEL[r.st]}</span><span class="v">${esc(r.text)}</span></div>`; }).join("");
}
function shiftLines(fa, fb, la, lb){
  const lines = [];
  const off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp");
  const grpShift = (list, who) => {
    const a = list.filter(fa), b = list.filter(fb);
    if(a.length<4 || b.length<4) return;
    const ca = countBy(a,s=>s.grp), cb = countBy(b,s=>s.grp);
    let best = null;
    new Set([...Object.keys(ca),...Object.keys(cb)]).forEach(k=>{
      const d = (cb[k]||0)/b.length - (ca[k]||0)/a.length;
      if(Math.abs(d)>=0.2 && (!best || Math.abs(d)>Math.abs(best.d))) best = {k,d,pa:(ca[k]||0)/a.length,pb:(cb[k]||0)/b.length};
    });
    if(best) lines.push(`${who}: ${best.k} went from ${pct(best.pa)} of snaps in the ${la} to ${pct(best.pb)} in the ${lb}.`);
  };
  const runShift = (list, who) => {
    const a = list.filter(fa), b = list.filter(fb);
    if(a.length<5 || b.length<5) return;
    const ra = runRate(a), rb = runRate(b);
    if(Math.abs(rb-ra)>=0.25) lines.push(`${who} ran on ${pct(ra)} of snaps in the ${la} and ${pct(rb)} in the ${lb}.`);
  };
  grpShift(off, `${usN()} personnel`); grpShift(def, "Your defensive package");
  runShift(off, usN()); runShift(def, oppN());
  if(!lines.length) lines.push(`No big changes between the ${la} and the ${lb} in what you charted.`);
  return lines;
}
function boxVsFilm(ph){
  const c = ctx(ph), g = G(), L = [];
  const u = f=>bv(c.box,"us",f), o = f=>bv(c.box,"opp",f);
  if(u("yds")!=null && o("yds")!=null) L.push(`Box score: ${usA()} ${u("yds")} yards, ${oppA()} ${o("yds")}.`);
  else L.push("Add total yards (tap Enter the full box score) to compare the stat sheet with your charting.");
  if(c.off.length){ const m = mode(c.off,s=>s.grp); L.push(`Your charting: ${usA()} lived in ${m.k} personnel (${m.n} of ${c.off.length} snaps) and ran on ${pct(runRate(c.off))}.`); }
  if(c.def.length){ const m = mode(c.def,s=>s.grp); L.push(`${oppA()} ran on ${pct(runRate(c.def))} of snaps. Your defense spent the most snaps in ${m.k} (${m.n} of ${c.def.length}).`); }
  const tell = [];
  if(u("yds")!=null && o("yds")!=null && u("yds")>=o("yds")+50 && g.score.us<=g.score.opp)
    tell.push(`${usN()} is winning the yardage and not the scoreboard. Look at turnovers and the red zone.`);
  const ra = u("rushAtt"), ry = u("rushYds");
  if(ra && ry!=null && ry/ra>=5 && c.off.length>=8 && runRate(c.off)<0.45)
    tell.push(`Running for ${(ry/ra).toFixed(1)} a carry but running on only ${pct(runRate(c.off))} of snaps. The film says lean on it.`);
  if(u("yds")!=null && u("yds")>=150 && c.snaps.some(s=>s.res) && exps(c.off)===0)
    tell.push("The yards came in a grind: no explosive plays charted.");
  const light = c.def.filter(s=>s.grp==="Nickel"||s.grp==="Dime");
  if(light.length>=5 && runRate(light)>=0.6)
    tell.push(`${oppN()} is running at your lighter packages: ${light.filter(s=>isRun(s.act)).length} runs on ${light.length} snaps against Nickel or Dime.`);
  if(c.def.length >= c.off.length+10)
    tell.push(`Your defense has played ${c.def.length} snaps to your offense's ${c.off.length}. Watch for the wear-down.`);
  return {L, tell: tell.length ? tell : ["Box score and charting agree so far. No hidden story yet."]};
}

/* ---------- final ---------- */
function outcome(){ const g=G(); return g.score.us>g.score.opp ? "W" : g.score.us<g.score.opp ? "L" : "T"; }
function decidingKey(){
  const res = outcome(); if(res==="T") return null;
  const aligned = id => { const raw = KEY[id].ev(ctx("final"), thOf(KEY[id])); if(!raw || raw.close) return false; return raw.pass === (res==="W"); };
  const rank = ids => ids.sort((a,b)=>keyRecord(b).rate - keyRecord(a).rate);
  const mine = rank(G().picked.filter(aligned));
  if(mine.length) return {id:mine[0], mine:true};
  const all = rank(KEYS.map(k=>k.id).filter(aligned));
  return all.length ? {id:all[0], mine:false} : null;
}
function story(){
  const g = G(), res = outcome(), off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp");
  const bits = [];
  bits.push(res==="W" ? (g.role==="Underdog" ? "Upset win." : "Win.") : res==="L" ? (g.role==="Favorite" ? "Upset loss." : "Loss.") : "Tie.");
  if(off.length){ const m = mode(off,s=>s.grp); bits.push(`${m.k} personnel carried the offense`); }
  if(def.length){ const rr = runRate(def); bits.push(rr>=0.55 ? `${oppN()} ran at you` : rr<=0.4 ? `${oppN()} threw it` : `${oppN()} stayed balanced`); }
  const d = decidingKey(); if(d) bits.push(`decided by ${KEY[d.id].short.toLowerCase()}`);
  return bits[0] + " " + bits.slice(1).join(", ").replace(/^./,c=>c.toUpperCase()) + (bits.length>1?".":"");
}
function howLines(){
  const g = G(), L = [], off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp");
  if(off.length){ const c = countBy(off,s=>s.grp);
    L.push(`${usA()} offense: ` + Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>{ const l=off.filter(s=>s.grp===k); return `${k} on ${l.length} snap${l.length>1?"s":""} (run ${pct(runRate(l))})`; }).join(", ") + "."); }
  if(def.length){ const c = countBy(def,s=>s.grp);
    L.push(`${oppA()} vs your packages: ` + Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>{ const l=def.filter(s=>s.grp===k); return `${k} ${l.length} snap${l.length>1?"s":""} (they ran ${pct(runRate(l))})`; }).join(", ") + "."); }
  const tds = plays(s=>s.res==="TD"||s.res==="Turnover TD");
  if(tds.length) L.push("Touchdowns charted: " + tds.map(s=>s.res==="Turnover TD" ? `${s.pos==="us"?oppA():usA()} return TD off ${s.pos==="us"?usA()+" "+s.grp+" personnel":"your "+s.grp} (${s.q===5?"OT":"Q"+s.q})` : `${s.pos==="us"?usA():oppA()} ${s.pos==="us"?s.grp:"vs "+s.grp}, ${ACT[s.act][2]} (${s.q===5?"OT":"Q"+s.q})`).join("; ") + ".");
  const tos = plays(s=>s.res==="Turnover"||s.res==="Turnover TD");
  if(tos.length) L.push("Turnovers charted: " + tos.map(s=>`${s.pos==="us"?usA():oppA()} on ${s.pos==="us"?s.grp+" personnel":"a snap vs your "+s.grp} (${s.q===5?"OT":"Q"+s.q})`).join("; ") + ".");
  const drives = countBy(def, s=>s.series); const longest = Math.max(0,...Object.values(drives));
  if(longest>=3) L.push(`Longest stand for your defense: ${longest} straight snaps.`);
  if(!L.length) L.push("Chart some snaps and the story shows up here.");
  return L;
}
function lockGame(){
  const g = G(), off = plays(s=>s.pos==="us"), def = plays(s=>s.pos==="opp");
  if(!g.opp){ alert("Add the opponent in the Scouting Report first."); return; }
  const agg = {off:{}, def:{}};
  off.forEach(s=>{ const a = agg.off[s.grp] = agg.off[s.grp]||{n:0,run:0,exp:0}; a.n++; if(isRun(s.act)) a.run++; if(s.res==="Explosive") a.exp++; });
  def.forEach(s=>{ const a = agg.def[s.grp] = agg.def[s.grp]||{n:0,run:0,exp:0}; a.n++; if(isRun(s.act)) a.run++; if(s.res==="Explosive") a.exp++; });
  const keyResults = {}; KEYS.forEach(k=>{ const r = keyState(k,"final"); if(r.st!=="nodata") keyResults[k.id] = r.st; });
  const d = decidingKey();
  const row = { id:g.id, us:g.us, opp:g.opp, role:g.role, tier:g.tier, score:{...g.score}, result:outcome(),
    snaps:off.length+def.length, offN:off.length, defN:def.length, agg, keyResults, picked:g.picked.slice(),
    deciding:d?d.id:null, pickedDeciding:!!(d&&d.mine), story:story(), when:Date.now() };
  const i = S.season.findIndex(x=>x.id===g.id);
  if(i>=0) S.season[i] = row; else S.season.push(row);
  g.locked = true; save(); renderFinalReport();
}

let WT = null;
function rnd(n){ return Math.floor(Math.random()*n); }
function startWalk(track){ WT = {track, rep:0, right:0, cur:null, answered:false}; nextRep(); }
function nextRep(){
  WT.rep++; WT.answered = false;
  if(WT.track==="pers") WT.cur = {ans:OFF[rnd(4)], v:{mirror:!!rnd(2), gun:!!rnd(2), alt:!!rnd(2)}};
  else WT.cur = {ans:DEF[rnd(4)], v:{mirror:!!rnd(2), dl3:!!rnd(2), db3:!!rnd(2)}};
  drawRep();
}
function drawRep(msg){
  const t = WT.track, opts = t==="pers" ? OFF : DEF;
  const glyph = t==="pers" ? glyphOff(WT.cur.ans, WT.cur.v, true) : glyphDef(WT.cur.ans, WT.cur.v, true);
  openSheet(`<div class="sheet-h"><span class="muted small">Walkthrough, rep ${Math.min(WT.rep,10)} of 10. Correct: ${WT.right}</span><button class="x" onclick="closeSheet()">Close</button></div>
    <h3 style="margin-top:4px">${t==="pers"?"Name the personnel":"Name the package"}</h3>
    <div class="gl-big">${glyph}</div>
    <div class="answer">${opts.map(o=>`<button id="ans-${o.replace(/\s/g,"_")}" onclick="answer('${o}')">${o}</button>`).join("")}</div>
    <p id="wtMsg" style="margin-top:10px;min-height:44px">${msg||""}</p>
    <div id="wtNext"></div>`);
}
function answer(o){
  if(WT.answered) return; WT.answered = true;
  const ok = o===WT.cur.ans; if(ok) WT.right++;
  const b = id => document.getElementById("ans-"+id.replace(/\s/g,"_"));
  b(WT.cur.ans).classList.add("right"); if(!ok) b(o).classList.add("wrong");
  const why = WT.track==="pers" ? `${WT.cur.ans} is ${OFF_SUB[WT.cur.ans]}.` : `${WT.cur.ans}: ${DEF_SUB[WT.cur.ans]}.`;
  document.getElementById("wtMsg").innerHTML = `<b>${ok?"Right.":"It was "+esc(WT.cur.ans)+"."}</b> ${esc(why)}`;
  const last = WT.rep>=10;
  if(last){ const P = S.profile; P.walk[WT.track] = Math.max(P.walk[WT.track]||0, WT.right); save(); }
  document.getElementById("wtNext").innerHTML = last
    ? `<p><b>${WT.right} of 10.</b> ${WT.right>=8?"That passes the walkthrough.":"8 of 10 passes. Run it again."}</p><button class="btn pri block" onclick="closeSheet();renderFilm()">Done</button>`
    : `<button class="btn pri block" onclick="nextRep()">Next rep</button>`;
}

function keyCards(ph){

  if(!g.picked.length) return `<div class="card">${emptyState(glyphOff("11"), "No keys picked", "Pick three in the Scouting Report and they're graded here.")}</div>`;

}
function boxBlock(ph){
  const need = neededFields(), b = ph==="half" ? G().half : G().fin;
  let needed = 0, filled = 0;
  for(const f in need) for(const side in need[f]){ needed++; const v = b[side][f]; if(v!==""&&v!=null) filled++; else if(f==="to" && G().snaps.some(s=>!s.st)) filled++; }
  const status = !needed ? "Nothing needed for your keys" : filled>=needed ? "All set" : `${needed-filled} number${needed-filled>1?"s":""} needed`;
  return `<details class="card boxd" ${needed && filled<needed ? "open" : ""}><summary><b>Box score</b><span class="bstat">${status}</span></summary><div style="margin-top:10px">${boxForm(ph)}</div></details>`;
}

];
function ladderSVG(r){
  const N = RANKS.length, H = 64*N + 36, pts = RANKS.map((_,i)=>({x: i%2 ? 96 : 40, y: H-30-i*64}));
  const seg = (a,b) => `C ${a.x} ${a.y-34}, ${b.x} ${b.y+34}, ${b.x} ${b.y}`;
  let done = "", rest = "";
  for(let i=1;i<N;i++){ const s = ` M${pts[i-1].x} ${pts[i-1].y} ${seg(pts[i-1],pts[i])}`; if(i<=r-1) done += s; else rest += s; }
  const top = pts[N-1];
  const nodes = pts.map((p,i)=>{
    const st = i < r ? "done" : i===r ? "cur" : "lock";
    const node = st==="done" ? `<circle cx="${p.x}" cy="${p.y}" r="15" fill="var(--us)"/><path d="M${p.x-6} ${p.y} l4 5 l9-10" stroke="var(--us-ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
      : st==="cur" ? `<circle class="pulse" cx="${p.x}" cy="${p.y}" r="21" fill="none" stroke="var(--hi)" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="15" fill="var(--surf)" stroke="var(--hi)" stroke-width="4"/>`
      : `<circle cx="${p.x}" cy="${p.y}" r="13" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="5 4"/>`;
    const col = st==="done" ? "var(--us)" : st==="cur" ? "var(--hi)" : "var(--muted)";
    const badge = `<g class="rk-ic ${st}"><circle cx="158" cy="${p.y}" r="21" fill="${st==="lock"?"var(--surf2)":"var(--us-soft)"}" stroke="${st==="lock"?"var(--line)":col}" stroke-width="2"/>
      <g transform="translate(${158-16} ${p.y-16})" fill="none" stroke="${col}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="${st==="lock"?.55:1}">${RANK_ICON[i]}</g></g>`;
    return `${node}${badge}<text x="192" y="${p.y-3}" class="ln ${st}">${esc(RANKS[i].n)}</text><text x="192" y="${p.y+15}" class="ls">${esc(RANKS[i].stage)}</text>`;
  }).join("");
  return `<svg class="ladder" viewBox="0 0 372 ${H}" role="img" aria-label="The charter ladder, drawn as a route from Student Assistant up to Head Coach">
    <path d="${rest}" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
    ${done ? `<path d="${done}" fill="none" stroke="var(--us)" stroke-width="5" stroke-linecap="round"/>` : ""}
    <path d="M${top.x-10} ${top.y-24} L${top.x} ${top.y-36} L${top.x+10} ${top.y-24}" fill="none" stroke="${r>=N?"var(--us)":"var(--line)"}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    ${nodes}</svg>`;
}
function renderFilm(){

  document.getElementById("filmOut").innerHTML = `

        <p class="hint">${esc(RANKS[r].adds)}.</p></div>` : `<p><b>Head Coach.</b> The top of the Staff.</p>`}
      <label class="lab" for="pName">Your name for bylines</label>
      <input class="f" id="pName" value="${esc(P.name)}" placeholder="Nate B." onchange="setName(this.value)">
    </div>
    <h3>Installs and walkthroughs</h3>
    ${[["pers","Offensive personnel","Read 11, 10, 12 and 21 before the camera cuts.",glyphOff("12")],
       ["pkg","Defensive packages","Count the DBs: 4 DB, Nickel, Dime, Goal line.",glyphDef("Nickel")],
       ["tend","Reading a tendency","Base, deviation, and what a Tendency Alert means.",glyphOff("21")]].map(([id,t,d,svg])=>`
      <div class="card inst"><div class="thumb">${svg}</div><div class="grow">
        <div class="row"><b class="grow">${t}</b><span class="st ${P.install[id]?"won":"nodata"}">${P.install[id]?"✓ Installed":"Not yet"}</span></div>
        <p class="hint" style="margin:2px 0 8px">${d}${id!=="tend" ? ` Best walkthrough: ${P.walk[id]} of 10.` : ""}</p>
        <div class="row"><button class="btn grow" onclick="openInstall('${id}')">Install</button>${id!=="tend"?`<button class="btn grow" onclick="startWalk('${id}')">Walkthrough</button>`:""}</div>
      </div></div>`).join("")}
    <h3>Season</h3>
    <div class="card">
      <div class="seg">${["All",...TIERS].map(t=>`<button class="chip ${FILMTIER===t?"on":""}" onclick="setFilmTier('${t}')">${t}</button>`).join("")}</div>
      ${games.length ? `<div class="recbig"><b>${W}–${L2}</b><span>${FILMTIER==="All"?"this season":"vs "+FILMTIER}</span></div>
        ${eyeN ? `<p class="hint">Your three keys included the Deciding Key in ${eyeY} of ${eyeN} games.</p>` : ""}
        ${games.slice().reverse().map(x=>`<div class="grow-row"><span class="wl ${x.result}">${x.result}</span><div><b>${x.score.us}–${x.score.opp} vs ${esc(x.opp)}</b><small>${esc(x.tier)}. ${esc(x.story||"")}</small></div></div>`).join("")}`
        : emptyState(glyphOff("11"), "Your season starts here", "Lock a game from the Final screen and it lands in your book.")}
    </div>
    <h3>Key Tracker</h3>
    <div class="card">${kt.length ? kt.map(x=>`<div class="ktr"><b>${esc(x.k.short)}</b><span class="pillw">Won it ${x.rec.wW}–${x.rec.wL}</span><span class="pilll">Lost it ${x.rec.lW}–${x.rec.lL}</span></div>`).join("")
        + `<p class="hint" style="margin-top:8px">${esc(G().us)}'s record when winning or losing each key. Small samples: don't generalize from one game.</p>`
      : emptyState(glyphDef("4 DB"), "No key records yet", "Every locked game grades every key, so you learn which ones really decide your games.")}</div>
    <h3>Tendencies</h3>
    <div class="card"><div class="eyebrow">${esc(G().us)} offense</div>${tend("off", OFF, "run")}</div>
    <div class="card"><div class="eyebrow">Your defense</div>${tend("def", DEF, "they ran")}</div>
    <div class="foot"><span>Your book lives on this device.</span><button class="link" onclick="copyBackup()">Copy backup</button><button class="link" onclick="restoreSheet()">Restore</button></div>`;
}

/* ---------- sheet + tabs ---------- */
function openSheet(html){ document.getElementById("sheetIn").innerHTML = html; document.getElementById("sheet").classList.add("on"); document.getElementById("scrim").classList.add("on"); document.getElementById("sheet").scrollTop = 0; }
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); document.getElementById("scrim").classList.remove("on"); }
const RENDER = {scout:renderScout, live:renderLive, half:renderHalf, final:renderFinal, film:renderFilm};
function go(t){
  S.tab = t; save(); hideCard(); applyColors();
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="p-"+t));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  RENDER[t](); window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.t)));
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeSheet(); hideCard(); } });
let SAMPLE = null, CAN_IMG = false, IMG_TYPES = "image/*";
(async () => {
  try{
    if(!window.claude || !window.claude.use) return;
    const smp = await window.claude.use("sample");
    if(!smp) return;
    const lim = await smp.limits().catch(()=>null);
    if(lim && lim.images){ SAMPLE = smp; CAN_IMG = true; if(lim.images.mediaTypes) IMG_TYPES = lim.images.mediaTypes.join(","); }
    if(S.tab==="half") renderHalf(); if(S.tab==="final") renderFinal(); if(S.tab==="scout") renderScout();
  }catch(e){}
})();
go(S.tab || "scout");
</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
