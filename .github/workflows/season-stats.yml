name: Refresh season stats

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build data/tendencies.json
        run: node build-tendencies.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Save it to the repo
        run: |
          git config user.name "xO Football bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tendencies.json
          git diff --staged --quiet || (git commit -m "Refresh season stats" && git push)
